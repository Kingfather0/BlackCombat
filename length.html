<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>영상 길이 · 블붕이</title>
<style>
  :root { --bg:#f6f6f7; --card:#fff; --text:#111; --sub:#666; --line:#e2e2e5; --kakao:#FEE500; --kakao-text:#191919; --ok:#1a7f37; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1b1c1f; --text:#f2f2f3; --sub:#9a9aa1; --line:#2c2d31; --ok:#4cc26a; --err:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0 auto; max-width:560px; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding: calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 28px); }
  h1 { font-size:20px; margin:4px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 14px; margin-bottom:12px; text-align:center; }
  #ttl { font-size:14px; color:var(--sub); word-break:keep-all; }
  #big { font-size:52px; font-weight:800; letter-spacing:.5px; margin:6px 0 2px; }
  #tag { font-size:12px; color:var(--sub); margin-bottom:6px; }
  button { width:100%; margin-top:12px; padding:14px; font-size:16px; font-weight:700; border:0; border-radius:12px; background:var(--kakao); color:var(--kakao-text); }
  button:active { filter:brightness(.94); }
  .help { text-align:left; font-size:14px; color:var(--sub); }
  .err { color:var(--err); }
</style>
</head>
<body>
<h1>⏱ 영상 길이</h1>

<div class="card" id="result" style="display:none">
  <div id="ttl"></div>
  <div id="big"></div>
  <div id="tag"></div>
  <button id="share" type="button">💬 카카오톡으로 공유</button>
</div>

<div class="card help" id="help" style="display:none">
  이 페이지는 직접 여는 곳이 아니라, <b>유튜브 영상 페이지에서 길이 확인 북마크를 누르면</b> 자동으로 넘어오는 결과 화면입니다.
</div>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  var KAKAO_JS_KEY = '1f76607417b6d6628a91c115005574ba';   // 블붕이 사이트에서 쓰는 도메인 제한 공개 키
  var SITE = 'https://xn--9r3b3ij2w.com/';
  var $ = function (id) { return document.getElementById(id); };

  var q = new URLSearchParams(location.search);
  var id = q.get('v') || '';
  var sec = parseInt(q.get('s'), 10);
  var title = (q.get('t') || '').slice(0, 100);
  var kind = q.get('k') || '';

  function fmt(n) {
    n = Math.round(Number(n)); if (!(n > 0)) return '';
    var h = Math.floor(n / 3600), m = Math.floor((n - h * 3600) / 60), s = n - h * 3600 - m * 60;
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
  }

  // 카톡 카드에서 눌렀을 때: 바로 유튜브 영상으로 이동
  if (q.get('go') === '1' && /^[A-Za-z0-9_-]{11}$/.test(id)) {
    location.replace('https://youtu.be/' + id);
    return;
  }

  function fmtKo(n) {
    n = Math.round(Number(n));
    var h = Math.floor(n / 3600), m = Math.floor((n - h * 3600) / 60), s = n - h * 3600 - m * 60;
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return h > 0 ? h + '시간 ' + p(m) + '분 ' + p(s) + '초' : m + '분 ' + p(s) + '초';
  }

  if (!/^[A-Za-z0-9_-]{11}$/.test(id) || !(sec > 0 && sec <= 86400)) {
    $('help').style.display = 'block';
    return;
  }

  $('ttl').textContent = title;
  $('big').textContent = '\u23F0 ' + fmtKo(sec);
  $('tag').textContent = kind === 'u' ? '프리미어 대기 중에 읽은 길이' : kind === 'l' ? '진행 중에 읽은 길이' : '';
  $('result').style.display = 'block';

  // 카톡 카드 이미지: 썸네일 아래에 진한 빨강 글씨로 길이를 얹어 미리 만들어 업로드해 둔다
  // (아이폰은 클릭 후 비동기 작업을 하면 카톡 앱 전환이 막혀서, 공유 버튼을 누르기 전에 준비)
  var cardImg = '', cardW = 480, cardH = 360;
  var thumb = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';

  function prepareCard() {
    try {
      if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          var W = 800, H = 450, c = document.createElement('canvas');
          c.width = W; c.height = H;
          var g = c.getContext('2d');
          // hqdefault는 위아래 검은 띠가 있어 16:9로 가운데만 잘라 사용
          var sh = img.naturalWidth * 9 / 16, sy = (img.naturalHeight - sh) / 2;
          g.drawImage(img, 0, sy, img.naturalWidth, sh, 0, 0, W, H);
          // 하단 흰 바 + 진한 빨강 글씨
          g.fillStyle = 'rgba(255,255,255,0.94)';
          g.fillRect(0, H - 110, W, 110);
          g.fillStyle = '#C80000';
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.font = '800 54px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
          g.fillText('\u23F0 영상 길이 ' + fmtKo(sec), W / 2, H - 55);
          c.toBlob(function (blob) {
            if (!blob) return;
            var file = new File([blob], 'len.png', { type: 'image/png' });
            Kakao.Share.uploadImage({ file: [file] }).then(function (up) {
              var u = up && up.infos && up.infos.original && up.infos.original.url;
              if (u) { cardImg = u; cardW = W; cardH = H; }
            }).catch(function () {});
          }, 'image/png');
        } catch (e) {}   // 캔버스가 막히면 기본 썸네일 카드로 보낸다
      };
      img.src = thumb;
    } catch (e) {}
  }
  prepareCard();

  // 클릭 핸들러 안에서 곧바로 호출해야 아이폰에서도 카톡 앱으로 넘어간다
  $('share').addEventListener('click', function () {
    var openUrl = SITE + 'length.html?go=1&v=' + id;          // 카드를 누르면 유튜브 영상으로 이동
    var link = { mobileWebUrl: openUrl, webUrl: openUrl };
    var head = title || '영상 길이 안내';
    if (head.length > 60) head = head.slice(0, 59) + '…';
    try {
      if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: head,
          description: '\u23F0 영상 길이 ' + fmtKo(sec) + '\nhttps://youtu.be/' + id,
          imageUrl: cardImg || thumb,
          imageWidth: cardImg ? cardW : 480, imageHeight: cardImg ? cardH : 360,
          link: link
        },
        buttons: [{ title: '영상 보기', link: link }]
      });
    } catch (e) {
      var text = '🎬 ' + head + '\n\u23F0 영상 길이 ' + fmtKo(sec) + '\nhttps://youtu.be/' + id;
      if (navigator.share) navigator.share({ text: text }).catch(function () {});
      else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { alert('공유 문구를 복사했어요. 카톡에 붙여넣기 하세요.'); });
      else prompt('아래 문구를 복사하세요', text);
    }
  });
})();
</script>
</body>
</html>
