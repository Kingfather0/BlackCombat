name: 티켓 판매 현황 자동 기록

on:
  workflow_dispatch:
    inputs:
      ticket_url:
        description: '(선택) 이번 한 번만 다르게 확인할 예매 페이지 주소'
        required: false
      target_date:
        description: '(선택) 이번 한 번만 다르게 확인할 날짜 (YYYY-MM-DD)'
        required: false
      event_key:
        description: '(선택) 테스트용 event_key — 비워두면 실제 행사 데이터에 기록됨. 다른 티켓으로 테스트할 땐 꼭 채워서(예: test_preview) 실제 데이터와 섞이지 않게 하세요.'
        required: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 스케줄 실행은 TICKET_WATCH_ENABLED 변수가 true일 때만 동작합니다.
    # (티켓 오픈 전/매진 후에는 굳이 10분마다 돌 필요가 없으니 꺼두세요)
    # 수동 실행(workflow_dispatch)은 이 값과 상관없이 항상 테스트해볼 수 있습니다.
    if: vars.TICKET_WATCH_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 설치
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: 티켓 현황 확인 및 기록
        env:
          TICKET_URL: ${{ github.event.inputs.ticket_url || vars.TICKET_URL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || vars.TICKET_TARGET_DATE }}
          EVENT_KEY: ${{ github.event.inputs.event_key || vars.TICKET_EVENT_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TICKET_BOT_SECRET: ${{ secrets.TICKET_BOT_SECRET }}
        run: node scripts/ticket-watch.js
      # ── 보조 대회 기록 (선택) ──────────────────────────────────────────
      # 대회 두 개를 동시에 추적할 때 사용합니다. 저장소 Variables에
      #   TICKET_URL_2 / TICKET_TARGET_DATE_2 / TICKET_EVENT_KEY_2
      # 세 개를 채우면 매 실행마다 이 대회도 이어서 기록됩니다 (비워두면 그냥 건너뜀).
      # SET_CURRENT=false 라서 사이트 메인 화면(판매 현황)은 위 메인 대회가 유지되고,
      # 보조 대회 데이터는 "지난 티켓"에서 계속 갱신됩니다.
      # 경기일(TICKET_TARGET_DATE_2)이 지나면 스크립트가 알아서 기록을 정지하므로
      # 따로 꺼줄 필요 없습니다. 대회가 완전히 끝나면 _2 변수들을 비워두면 됩니다.
      - name: (선택) 보조 대회 기록 — TICKET_URL_2 설정 시에만 실행
        if: ${{ !cancelled() && vars.TICKET_URL_2 != '' }}
        env:
          TICKET_URL: ${{ vars.TICKET_URL_2 }}
          TARGET_DATE: ${{ vars.TICKET_TARGET_DATE_2 }}
          EVENT_KEY: ${{ vars.TICKET_EVENT_KEY_2 }}
          SET_CURRENT: 'false'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TICKET_BOT_SECRET: ${{ secrets.TICKET_BOT_SECRET }}
        run: node scripts/ticket-watch.js
      - name: 실패 시 디버그 스크린샷 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-debug-screenshot
          path: ticket-debug.png
          if-no-files-found: ignore
