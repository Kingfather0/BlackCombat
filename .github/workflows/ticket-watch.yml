name: 티켓 판매 현황 자동 기록

on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각 1시간마다 실행 (GitHub 사정에 따라 실제 실행은 몇 분 늦어질 수 있음)
  workflow_dispatch:
    inputs:
      ticket_url:
        description: '(선택) 이번 한 번만 다르게 확인할 예매 페이지 주소'
        required: false
      target_date:
        description: '(선택) 이번 한 번만 다르게 확인할 날짜 (YYYY-MM-DD)'
        required: false
      event_key:
        description: '(선택) 테스트용 event_key — 비워두면 실제 행사 데이터에 기록됨. 다른 티켓으로 테스트할 땐 꼭 채워서(예: test_preview) 실제 데이터와 섞이지 않게 하세요.'
        required: false
      item_id_29cm:
        description: '(선택) 29CM 테스트용 티켓 상품번호 — https://ticket.29cm.co.kr/catalog/{이 숫자}'
        required: false
      event_key_29cm:
        description: '(선택) 29CM 테스트용 event_key — 비워두면 실제 행사 데이터에 기록됨. 다른 티켓으로 테스트할 땐 꼭 채워서(예: test_29cm_preview) 실제 데이터와 섞이지 않게 하세요.'
        required: false

# 이전 실행이 아직 안 끝났으면(예: 29CM/NOL 사이트가 응답을 안 줘서 멈춰있는 경우) 새 스케줄
# 실행이 그 뒤에 계속 쌓이지 않도록, 새 실행이 시작되면 이전 실행을 취소한다. 매시 정각마다
# 도는 워크플로우라 취소해도 잃는 데이터가 없다(다음 실행이 최신 상태를 다시 기록함).
concurrency:
  group: ticket-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    # 스케줄 실행은 TICKET_WATCH_ENABLED 변수가 true일 때만 동작합니다.
    # (티켓 오픈 전/매진 후에는 굳이 10분마다 돌 필요가 없으니 꺼두세요)
    # 수동 실행(workflow_dispatch)은 이 값과 상관없이 항상 테스트해볼 수 있습니다.
    if: vars.TICKET_WATCH_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    # 안전장치: 사이트가 응답 없이 멈춰버리면(타임아웃 없는 요청 등) 잡 자체가 몇 시간이고
    # "In progress"로 남아있을 수 있다 — 그런 경우를 대비해 넉넉하지만 유한한 상한을 둔다.
    # (판매 일시중지→재개처럼 사이트가 이상 반응을 보일 때 실제로 이 문제가 발생했었다.)
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 2026-08-19: Playwright는 아래 "티켓 현황 확인 및 기록"(NOL) 단계에서만 쓰는데,
      # 이 설치 단계에 조건이 없어서 NOL을 안 쓰고 29CM(블랙컴뱃)만 쓰는 실행에서도 매번
      # 돌고 있었다 — 게다가 캐시도 없어서 매번 크로미움 브라우저 바이너리(약 150MB+)를
      # 새로 내려받다 보니(로그 확인 결과, 폰트 패키지 21MB 받는 데만 40초+, 정작 크로미움
      # 본체 다운로드는 시작도 못 하고) 10분을 다 채우고 다음 스케줄(10분 간격 외부 크론)에
      # 취소당하는 일이 실제로 있었다 — 이러면 NOL은 물론 뒤 단계인 29CM(블랙컴뱃) 기록까지
      # 같이 취소돼 아예 기록이 안 남는다. 그래서 1) NOL을 쓸 때만 설치하도록 조건을 걸고,
      # 2) 브라우저 바이너리를 캐시해서 두 번째 실행부터는 다운로드 없이 몇 초 만에 끝나게 한다.
      - name: Playwright 브라우저 캐시
        if: ${{ github.event.inputs.ticket_url != '' || vars.TICKET_URL != '' || vars.TICKET_URL_2 != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1-chromium
      - name: Playwright 설치
        if: ${{ github.event.inputs.ticket_url != '' || vars.TICKET_URL != '' || vars.TICKET_URL_2 != '' }}
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: 티켓 현황 확인 및 기록 — TICKET_URL 설정 시에만 실행
        if: ${{ github.event.inputs.ticket_url != '' || vars.TICKET_URL != '' }}
        env:
          TICKET_URL: ${{ github.event.inputs.ticket_url || vars.TICKET_URL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || vars.TICKET_TARGET_DATE }}
          EVENT_KEY: ${{ github.event.inputs.event_key || vars.TICKET_EVENT_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TICKET_BOT_SECRET: ${{ secrets.TICKET_BOT_SECRET }}
        run: node scripts/ticket-watch.js
      # ── 보조 대회 기록 (선택) ──────────────────────────────────────────
      # 대회 두 개를 동시에 추적할 때 사용합니다. 저장소 Variables에
      #   TICKET_URL_2 / TICKET_TARGET_DATE_2 / TICKET_EVENT_KEY_2
      # 세 개를 채우면 매 실행마다 이 대회도 이어서 기록됩니다 (비워두면 그냥 건너뜀).
      # SET_CURRENT=false 라서 사이트 메인 화면(판매 현황)은 위 메인 대회가 유지되고,
      # 보조 대회 데이터는 "지난 티켓"에서 계속 갱신됩니다.
      # 경기일(TICKET_TARGET_DATE_2)이 지나면 스크립트가 알아서 기록을 정지하므로
      # 따로 꺼줄 필요 없습니다. 대회가 완전히 끝나면 _2 변수들을 비워두면 됩니다.
      - name: (선택) 보조 대회 기록 — TICKET_URL_2 설정 시에만 실행
        if: ${{ !cancelled() && vars.TICKET_URL_2 != '' }}
        env:
          TICKET_URL: ${{ vars.TICKET_URL_2 }}
          TARGET_DATE: ${{ vars.TICKET_TARGET_DATE_2 }}
          EVENT_KEY: ${{ vars.TICKET_EVENT_KEY_2 }}
          SET_CURRENT: 'false'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TICKET_BOT_SECRET: ${{ secrets.TICKET_BOT_SECRET }}
        run: node scripts/ticket-watch.js
      # ── 29CM 티켓 기록 (선택) ──────────────────────────────────────────
      # 29CM(ticket.29cm.co.kr)에서 파는 티켓용입니다. NOL과 달리 로그인 없이도 열리는
      # 공개 API를 그대로 쓰기 때문에 브라우저(Playwright) 없이 가볍게 동작합니다.
      # 저장소 Variables에 ITEM_ID_29CM(예: https://ticket.29cm.co.kr/catalog/3998565 → 3998565)와
      # TICKET_EVENT_KEY_29CM 을 채우면 매 실행마다 이어서 기록됩니다 (비워두면 그냥 건너뜀).
      # TICKET_29CM_SET_CURRENT 를 'false'로 두면 사이트 메인 화면은 위쪽(NOL) 대회가 계속 차지하고
      # 29CM 데이터는 "지난 티켓"에서만 갱신됩니다 — 기본값은 'true'(29CM이 메인)입니다.
      # 어느 쪽을 메인으로 할지는 상황에 맞게 이 변수로 뒤집으면 됩니다.
      - name: (선택) 29CM 티켓 기록 — ITEM_ID_29CM 설정 시에만 실행
        if: ${{ !cancelled() && (github.event.inputs.item_id_29cm != '' || vars.ITEM_ID_29CM != '') }}
        env:
          ITEM_ID_29CM: ${{ github.event.inputs.item_id_29cm || vars.ITEM_ID_29CM }}
          TARGET_DATE: ${{ vars.TICKET_TARGET_DATE_29CM }}
          EVENT_KEY: ${{ github.event.inputs.event_key_29cm || vars.TICKET_EVENT_KEY_29CM }}
          SET_CURRENT: ${{ vars.TICKET_29CM_SET_CURRENT || 'true' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TICKET_BOT_SECRET: ${{ secrets.TICKET_BOT_SECRET }}
        run: node scripts/ticket-watch-29cm.js
      - name: 실패 시 디버그 스크린샷 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-debug-screenshot
          path: ticket-debug.png
          if-no-files-found: ignore
