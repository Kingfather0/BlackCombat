name: 유튜브 업로드 자동 동기화

on:
  schedule:
    # "10분마다 도는데 왜 87분씩 비냐"는 지적(2026-08-27) 반영 — 원래 '*/10 * * * *'는
    # 정각 기준 매 10분(00·10·20·30·40·50분)에 딱 맞춰 도는데, 이 "정각/5의배수 분"은
    # 전 세계 수많은 저장소의 스케줄 워크플로우가 똑같이 몰리는 시간대라 GitHub 서버가
    # 가장 붐빈다(GitHub 공식 문서도 "정시 부근이 가장 혼잡하니 다른 분으로 스케줄하라"고
    # 안내함). 그날 실행 로그를 보면 정각대 스케줄에서 몇 틱씩 통째로 드롭되는 게 원인으로
    # 보여, 주기는 그대로 10분을 유지하면서(느려지지 않게) 혼잡한 정각대를 피해 3분으로
    # 옮겼다 — 03·13·23·33·43·53분에 실행. 완전히 없앨 수는 없지만 드롭 빈도를 줄이는
    # 목적. 그래도 계속 크게 밀리면 간격 자체를 늘리는 것도 재검토.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

# 이전 실행이 아직 안 끝났으면 새 스케줄 실행이 그 뒤에 계속 쌓이지 않도록,
# 새 실행이 시작되면 이전 실행을 취소한다. 짧은 주기로 도는 워크플로우라 취소해도
# 잃는 데이터가 없다(다음 실행이 최신 상태를 다시 가져와서 채운다).
concurrency:
  group: yt-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # YT_BOT_SECRET(저장소 Secret)이 아직 설정되지 않았으면 스케줄 실행은 건너뛴다 —
    # 유튜브_업로드예측_패치.sql의 안내대로 site_data에 yt_bot_secret을 설정하고
    # 같은 값을 이 저장소 Secret으로 등록해야 자동 동기화가 동작한다.
    # 수동 실행(workflow_dispatch)은 이 조건과 상관없이 항상 시도해볼 수 있다(설정이
    # 안 됐다면 스크립트가 명확한 에러 메시지로 실패한다).
    if: ${{ vars.YT_SYNC_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 유튜브 업로드 동기화 실행
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          YT_BOT_SECRET: ${{ secrets.YT_BOT_SECRET }}
