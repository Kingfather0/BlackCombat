name: 공식 경기 목록 자동 수집

# "매일 정오쯤 너가 직접 자동화로 불러올 필요없다"는 지적 반영(2026-08-26) —
# 정기 스케줄(schedule)을 껐다. 이제 새 경기는 관리자 화면(#/admin/yttest →
# "➕ 새 경기 직접 등록")에서 직접 등록하면 바로 캘린더에 반영된다. 이 워크플로우와
# scripts/official-match-sync.js는 지우지 않고 남겨뒀다 — 나중에 한 번씩 수동으로
# 공식 홈페이지 목록을 다시 긁어와 제안 박스를 갱신하고 싶을 때, Actions 탭에서
# "Run workflow" 버튼으로 그때그때 수동 실행할 수 있다.
on:
  workflow_dispatch: {}

concurrency:
  group: official-match-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 공식 경기 목록 수집 실행
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          YT_BOT_SECRET: ${{ secrets.YT_BOT_SECRET }}
        run: node scripts/official-match-sync.js
