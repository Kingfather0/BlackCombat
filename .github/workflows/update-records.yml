name: 선수 공식 전적 자동 갱신

on:
  schedule:
    - cron: '15 20 * * *'   # 매일 UTC 20:15 = 한국시간 새벽 5:15 (랭킹 갱신 직후)
  workflow_dispatch: {}      # GitHub에서 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 공식 전적 수집
        run: node scripts/update-records.js
      - name: 변경 시 커밋
        run: |
          if git diff --quiet records.json 2>/dev/null && [ -f records.json ]; then
            echo "변경 없음 - 커밋 생략"
          else
            git config user.name "records-bot"
            git config user.email "actions@users.noreply.github.com"
            git pull --rebase origin main || true
            git add records.json
            git commit -m "선수 공식 전적 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          fi
