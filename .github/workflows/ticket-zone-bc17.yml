name: 블랙컴뱃17 구역별 좌석 수집 (로그인 세션)

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 새 실행이 이어받음 (각 실행은 약 5시간 40분 동안 1분 간격으로 수집)
  workflow_dispatch: {}

# 실행이 겹치지 않게 한 번에 하나만 — 새 실행은 앞 실행이 끝나길 기다린다(취소하지 않음)
concurrency:
  group: ticket-zone-bc17
  cancel-in-progress: false

# 다음 실행을 스스로 이어 붙이기 위해 필요한 권한
permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 변수 TICKET_ZONE_BC17_CLOUD 가 true 일 때만 스케줄 실행(수동 실행은 항상 가능)
    if: vars.TICKET_ZONE_BC17_CLOUD == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 설치
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: 구역별 좌석 수집
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          Z17_SESSION: ${{ secrets.Z17_SESSION }}
          Z17_ENC_KEY: ${{ secrets.Z17_ENC_KEY }}
          Z17_EVERY_SEC: '15'   # 빠른 회차 주기(초). 10초에서 약 6분 만에 세션 만료(401)가 나 15로 되돌림
        run: node scripts/ticket-zone-bc17-cloud.js
      # 이 실행이 정상적으로 끝나면(약 5시간 40분) 바로 다음 실행을 스스로 시작해 끊김 없이 이어간다.
      # (GitHub의 예약 실행은 지연·누락되는 일이 잦아서, 예약에만 기대지 않는다.)
      # 로그인 세션 만료 등으로 실패한 경우에는 이어 붙이지 않는다(무한 반복 방지).
      - name: 다음 실행 이어 붙이기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ticket-zone-bc17.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
