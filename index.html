<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔥블랙컴뱃 잡담방🔥 승부예측</title>
<meta property="og:title" content="🔥블랙컴뱃 잡담방🔥 승부예측">
<meta property="og:description" content="블랙컴뱃 승부예측 투표 · 자동 집계 · 격잘알 랭킹">
<meta property="og:image" content="https://kingfather0.github.io/BlackCombat/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kingfather0.github.io/BlackCombat/">
<meta name="description" content="격투기 승부예측 투표 · 자동 집계 · 랭킹">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f6fa">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="승부예측">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --card2:#eef2f8; --border:#d8dfe9;
  --text:#1b2430; --muted:#525d6b; --dim:#818c9b;
  --key:#2563eb; --key-deep:#1d4ed8; --key-soft:#e8effd;
  --red:#c62828; --blue:#2563eb; --green:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;
  line-height:1.65; font-size:16px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 80px}
/* header */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:3px solid var(--key);box-shadow:0 1px 6px rgba(20,40,80,.07)}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-weight:900;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;color:var(--text)}
.logo img{width:38px;height:38px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.logo small{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:0}
nav{display:flex;gap:4px}
nav a{padding:8px 13px;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--muted);white-space:nowrap}
nav a.on{background:var(--key);color:#fff}
nav a:hover:not(.on){background:var(--card2);color:var(--text)}
/* common */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.sec-title{font-size:17px;font-weight:800;color:var(--text);margin:32px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:4px solid var(--key);padding-left:10px}
h1.page{font-size:24px;font-weight:900;margin-top:24px;line-height:1.35}
.sub{color:var(--muted);font-size:14.5px;margin-top:6px}
.badge{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;vertical-align:2px}
.badge.live{background:var(--key-soft);color:var(--key-deep)}
.badge.rt{background:#e0f3e6;color:#116131}
.badge.wait{background:#fdf0cd;color:#7c5a06}
.badge.done{background:#fdecec;color:#a51c1c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:11px 18px;font-weight:800;font-size:15px;transition:.15s;color:var(--text)}
.btn:hover{border-color:var(--key);background:#f8faff}
.btn.primary{background:var(--key);border:1.5px solid var(--key-deep);color:#fff}
.btn.primary:hover{background:var(--key-deep)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.wide{width:100%;padding:15px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin-top:12px}
.field label{display:block;font-size:13.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 13px;color:var(--text);outline:none;font-size:16px}
.field input:focus{border-color:var(--key)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:700;display:none}
.msg.err{display:block;background:#fdecec;color:#a51c1c;border:1px solid #f2bcbc}
.msg.ok{display:block;background:#e0f3e6;color:#116131;border:1px solid #b3ddc0}
.empty{color:var(--dim);text-align:center;padding:36px 0;font-size:15px}
.center{text-align:center}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
/* home cards */
.t-card{display:block;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--key);border-radius:12px;padding:16px;margin-top:12px;transition:.15s;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.t-card:hover{filter:brightness(.985)}
.t-card .tt{font-size:17.5px;font-weight:800}
.t-card .meta{display:flex;gap:14px;color:var(--muted);font-size:14px;margin-top:8px;flex-wrap:wrap}
.countdown{color:#c62828;font-weight:800}
/* match voting */
.match{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.match .no{font-size:14px;font-weight:900;color:var(--text);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.vs-row{display:grid;grid-template-columns:1fr 36px 1fr;align-items:stretch;gap:5px}
.corner{border-radius:10px;padding:14px 6px;font-weight:800;font-size:16px;border:1.5px solid var(--border);background:#fff;color:var(--text);transition:.12s;word-break:keep-all;line-height:1.35}
.corner.red.sel{background:var(--red);border-color:#a51c1c;color:#fff}
.corner.blue.sel{background:#2563eb;border-color:#1d43a8;color:#fff}
.corner:not(.sel):hover{border-color:var(--key)}
.corner .cn{display:block;font-size:10.5px;font-weight:900;letter-spacing:1px;margin-bottom:2px}
.corner.red .cn{color:var(--red)}
.corner.blue .cn{color:#2563eb}
.corner.sel .cn{color:#fff;opacity:.85}
.vs{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--dim)}
.wintag{font-size:13px;font-weight:900;color:var(--text)}
/* split bar */
.split{margin-top:11px}
.split .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:5px}
.split .lbl .a{color:#a51c1c}.split .lbl .b{color:#1d43a8}
.split .bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#e3e8f0}
.split .bar i{display:block;height:100%}
.split .bar .ia{background:#d64545}
.split .bar .ib{background:#3b66d6}
/* tables */
.tbl-scroll{overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 4px rgba(20,40,80,.06)}
table{border-collapse:collapse;width:100%;font-size:15px;white-space:nowrap}
th,td{padding:11px 12px;border-bottom:1px solid #e8ecf2;text-align:center}
th{background:var(--card2);font-size:13.5px;color:#334052;font-weight:800;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.nick,th.nick{text-align:left;position:sticky;left:0;background:var(--card);font-weight:800;max-width:150px;overflow:hidden;text-overflow:ellipsis}
th.nick{background:var(--card2)}
.pick-chip{display:inline-block;min-width:48px;padding:3px 8px;border-radius:7px;font-weight:800;font-size:13.5px}
.pick-chip.A{background:#fdeaea;color:#a51c1c}
.pick-chip.B{background:#e3ebfb;color:#1c47a8}
.pick-chip.hit{background:var(--key);color:#fff}
.pick-chip.miss{opacity:.4;text-decoration:line-through}
.rank-1{font-weight:900}
/* 닉네임 링크 (누르면 전적 페이지) */
.plink{color:var(--text);text-decoration:none;font-weight:800}
.plink::after{content:'전적';margin-left:5px;font-size:10.5px;font-weight:800;color:var(--key-deep);background:var(--key-soft);padding:1.5px 7px;border-radius:99px;vertical-align:2px}
.plink:hover::after{background:var(--key);color:#fff}
/* 순위 칩 */
.rk{display:inline-block;min-width:44px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13.5px;background:#eef1f6;color:var(--muted)}
.medal-e{font-size:21px;line-height:1}
.rk.r3{background:#e6eaf0;color:#334052}
/* 숫자 칩 (표 안 수치 강조) */
.stat-chip{display:inline-block;min-width:46px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13.5px;background:#f1f4f8;color:#334052}
.stat-chip.b{background:var(--key-soft);color:var(--key-deep)}
.stat-chip.dash{background:transparent;color:#b3bcc7}
/* stats chips */
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--key);border-radius:12px;padding:13px;text-align:center;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.tile .v{font-size:22px;font-weight:900}
.tile .k{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.note{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.7}
footer{margin-top:60px;padding:22px 0;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:13px}
footer a{color:var(--dim);text-decoration:underline}
/* winner hero */
.hero{background:linear-gradient(170deg,#eef3ff,#ffffff);border:1.5px solid var(--key) !important}
/* admin */
.admin-t{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;background:var(--card);box-shadow:0 1px 4px rgba(20,40,80,.06)}
.admin-t .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.res-btn{padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:800;color:var(--text)}
.res-btn.selA{background:var(--red);border-color:#a51c1c;color:#fff}
.res-btn.selB{background:#2563eb;border-color:#1d43a8;color:#fff}
.res-btn.selX{background:#525d6b;border-color:#3d4650;color:#fff}
.res-row{display:grid;grid-template-columns:1fr 1fr 64px;gap:6px;margin-top:8px}
.mrow{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:7px;align-items:center;margin-top:8px}
.mrow input{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:10px 11px;color:var(--text);width:100%;outline:none}
.del-x{color:var(--dim);font-size:17px;text-align:center}
.del-x:hover{color:#a51c1c}
/* setup screen */
.setup{max-width:560px;margin:60px auto;padding:0 16px}
.setup code{background:var(--card2);border:1px solid var(--border);padding:2px 7px;border-radius:6px;font-size:13px;color:var(--key-deep)}
.setup ol{margin:14px 0 0 20px;display:grid;gap:8px;font-size:14px}
.match{padding:11px 13px;margin-top:8px}
.corner{padding:10px 6px;font-size:15px}
.fmeta{display:block;font-size:11px;font-weight:700;margin-top:3px;opacity:.9}
.votebar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--key);z-index:60;box-shadow:0 -4px 16px rgba(20,40,80,.12)}
.votebar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
.votebar .cnt{font-weight:800;font-size:15px}
.votebar .cnt b{color:var(--key-deep);font-size:17px}
body.has-votebar .wrap{padding-bottom:160px}
.hero2{background:linear-gradient(170deg,#f1f5f9,#ffffff);border:1.5px solid #94a3b8 !important}
.fpick{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;background:#fff}
.fpick:hover{border-color:var(--key);background:#f8faff}
#fp-div{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px}
/* 선수 랭킹 그리드 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;margin-top:14px}
.fdiv{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.fdiv-t{font-weight:900;color:var(--key-deep);font-size:14.5px;border-bottom:2px solid var(--key);padding-bottom:6px;margin-bottom:6px}
.frow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f0f2f6;font-size:13px}
.frow:last-child{border-bottom:none}
.frk{min-width:24px;text-align:center;font-weight:800;color:var(--muted);font-size:11.5px;background:#eef1f6;border-radius:6px;padding:1px 0;flex-shrink:0}
.frk.c{background:var(--key);color:#fff}
.fnm{font-size:13px;flex:1;font-weight:800;line-height:1.25;word-break:keep-all}
.frec{color:var(--dim);font-size:11.5px;font-weight:700;flex-shrink:0}
.fbadge{font-size:9px;font-weight:900;border-radius:5px;padding:1px 4px;vertical-align:1px}
.fbadge.hot{background:#fdecec;color:#c62828}
.fbadge.new{background:#e8effd;color:#1d4ed8}
.fmove{font-size:10px;font-weight:900}
.fmove.up{color:#c62828}
.fmove.down{color:#2563eb}
.flag{vertical-align:-2px;border-radius:2px;flex-shrink:0}
/* 1·2등 포디움 */
.prow{display:flex;align-items:center;gap:13px;padding:12px 8px;background:transparent}
.prow.p2{border-top:1px solid #eef1f6}
.pmd{font-size:32px;line-height:1;flex-shrink:0}
.plab{display:block;font-size:10.5px;font-weight:900;letter-spacing:2px}
.prow.p1 .plab{color:#b08a1e}
.prow.p2 .plab{color:#64788f}
.pnames{display:block;font-weight:900;font-size:17.5px;min-width:0;word-break:keep-all;color:var(--text)}
.pscore{font-weight:800;font-size:13px;flex-shrink:0;color:var(--muted)}
/* 참가자 예측 카드 */
.pcard{background:#fff;border:1px solid var(--border);border-radius:11px;margin-top:8px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,80,.05)}
.pcard-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:15px;text-align:left}
.pcard-h:hover{background:#f8faff}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{color:var(--dim);font-size:12px;font-weight:700;flex-shrink:0}
.pcard-b{padding:2px 14px 12px;border-top:1px solid #eef1f6}
.pchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pchip{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.pchip i{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:700}
/* 닉네임/비밀번호 카드 압축 */
.vform{padding:11px 14px 12px}
.vform .field{margin-top:0}
.vform .field label{font-size:11.5px;margin-bottom:4px}
.vform .field input{padding:9px 11px;font-size:15px}
.vform .note{margin-top:8px;font-size:12px;line-height:1.5}
/* 투표 카드 압축 그리드 */
.vote-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
@media(min-width:600px){.vote-grid{grid-template-columns:1fr 1fr}}
.vote-grid .match{margin-top:0;padding:10px 12px}
.vote-grid .match .no{font-size:12px;margin-bottom:5px;color:var(--muted)}
.vote-grid .corner{padding:9px 4px;font-size:14px}
.vote-grid .fmeta{font-size:10px;margin-top:2px}
.vote-grid .split{margin-top:6px}
.vote-grid .split .lbl{font-size:12px;margin-bottom:3px;font-weight:800}
.vote-grid .split .bar{height:8px}
/* 칭호 배지 */
.ubadge{display:inline-block;font-size:10.5px;font-weight:800;background:#f4f0e2;color:#7a5c10;border:1px solid #e6d9b0;border-radius:99px;padding:1.5px 8px;vertical-align:1px;white-space:nowrap;cursor:help}
.ubadge.lose{background:#fdecec;color:#a51c1c;border-color:#f0c4c4}
/* 규칙 안내 */
.rule{padding:10px 0;border-bottom:1px dashed #eef1f6;font-size:14px;line-height:1.65}
.rule:last-child{border-bottom:none}
/* 선물 관련 */
.gift-name{display:inline-block;background:#fff;border:1.5px solid #dcbf6a;border-radius:8px;padding:2px 10px;font-weight:800;color:#26200f;margin:2px 3px 2px 0;font-size:14px}
.gift-banner{border:1.5px solid #e6c34d !important;background:#fffaf0 !important}
/* 참가자 예측 현황 버튼 (입체) */
.btn-parts{background:var(--key);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13.5px;box-shadow:0 2px 6px rgba(37,99,235,.28);transition:.15s;cursor:pointer;letter-spacing:.2px}
.btn-parts:hover{background:var(--key-deep);box-shadow:0 4px 10px rgba(37,99,235,.35)}
.btn-parts:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(37,99,235,.3)}
/* 경기별 투표자 팝업 */
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mv-col{background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px}
.mv-h{font-weight:900;font-size:14.5px;padding-bottom:7px;border-bottom:1.5px solid #eef1f6;margin-bottom:6px;word-break:keep-all}
.mv-h.a{color:#a51c1c}.mv-h.b{color:#1d43a8}
.mv-h span{color:var(--dim);font-weight:700;font-size:12px}
.mv-names{display:flex;flex-wrap:wrap;gap:5px}
.mv-n{display:inline-block;padding:3px 9px;background:#f2f5f9;border-radius:7px;font-weight:700;font-size:13px;color:var(--text)}
a.mv-n:hover{background:var(--key-soft);color:var(--key-deep)}
/* 참가자 예측 팝업 */
#pwaInstall{position:fixed;right:14px;bottom:14px;z-index:90;border:none;cursor:pointer;
  background:var(--key);color:#fff;font-weight:800;font-size:13px;padding:9px 15px;border-radius:999px;
  box-shadow:0 4px 14px rgba(37,99,235,.35);font-family:inherit;display:flex;align-items:center;gap:5px;transition:background .15s}
#pwaInstall:hover{background:var(--key-deep)}
#pwaGo{position:fixed;inset:0;background:rgba(10,14,22,.72);z-index:200;display:flex;align-items:center;justify-content:center}
#pwaGo .pwago-box{background:#fff;border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:300px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#pwaGo img{width:72px;height:72px;border-radius:16px}
#pwaGo b{font-size:16px}
#pwaGo span{font-size:13px;color:var(--muted)}
#pwaGo button{margin-top:6px;border:none;cursor:pointer;background:var(--key);color:#fff;font-weight:800;font-size:14.5px;padding:11px 22px;border-radius:10px;font-family:inherit}
#gArea,#gArea button,#gArea input,.gmenu-head,.gcard,.gmenu-foot,.gback{font-family:'Jua','Pretendard Variable',Pretendard,sans-serif}

const SUPABASE_URL      = "https://dbtzakbmyfmqudjiycoj.supabase.co";

/* ---------- 초기화 ---------- */
const $app = document.getElementById('app');
let sb = null;            // supabase client
let timeOffset = 0;       // 서버시간 - 내시간 (ms)
let pollTimer = null;     // 자동 새로고침 타이머

function isConfigured(){
  return !SUPABASE_URL.includes('여기에') && !SUPABASE_ANON_KEY.includes('여기에');
}
function svrNow(){ return new Date(Date.now() + timeOffset); }

async function boot(){
  if (window.__TEST_SB) { sb = window.__TEST_SB; }
  else if (!isConfigured()){ renderSetup(); return; }
  else {
    if (typeof supabase === 'undefined'){
      $app.innerHTML = '<div class="empty">네트워크 문제로 페이지를 불러오지 못했습니다.<br>잠시 후 새로고침(F5) 해주세요.</div>';
      return;
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  try{
    const {data} = await sb.rpc('server_now');
    if (data) timeOffset = new Date(data).getTime() - Date.now();
  }catch(e){}
  // 선수 랭킹: 자동 갱신 파일(fighters.json)과 수동 갱신(DB) 중 더 최신 데이터 사용
  let cand = [];
  try{
    const r = await fetch('fighters.json?ts=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && Array.isArray(j.divisions) && j.divisions.length >= 5) cand.push({d:j.divisions, t:j.updated_at});
    }
  }catch(e){}
  try{
    const {data} = await sb.from('site_data').select('value,updated_at').eq('key','fighters').single();
    if(data && data.value && Array.isArray(data.value.divisions) && data.value.divisions.length >= 5)
      cand.push({d:data.value.divisions, t:data.updated_at});
  }catch(e){}
  if(cand.length){
    cand.sort((a,b)=>new Date(b.t||0)-new Date(a.t||0));
    FIGHTERS = cand[0].d;
    fightersUpdatedAt = cand[0].t;
    buildFighterMap();
const BASE_FLAGS = {};
Object.entries(FIGHTER_MAP).forEach(([k,f])=>{ if(f.flag && f.flag!=='kr') BASE_FLAGS[k]=f.flag; });
  }
  route();
}
window.addEventListener('hashchange', route);

// ── PWA: 홈 화면 앱 설치 ──
let __pwaPrompt = null;
const __isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const __isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const __isKakao = /KAKAOTALK/i.test(navigator.userAgent);
const __isSafariMac = /Macintosh/.test(navigator.userAgent) && /Safari\//.test(navigator.userAgent) && !/Chrome|Chromium|Edg\//.test(navigator.userAgent);
let __wantInstall = false;
try{
  if(new URLSearchParams(location.search).has('install')){
    __wantInstall = true;
    history.replaceState(null, '', location.pathname + location.hash);
  }
}catch(e){}
function showPwaBtn(){
  if(__isStandalone || window.__TEST_SB) return;
  if(document.getElementById('pwaInstall')) return;
  const b = document.createElement('button');
  b.id = 'pwaInstall';
  b.textContent = '📱 앱 설치';
  b.onclick = pwaInstallClick;
  document.body.append(b);
}
async function doPrompt(){
  if(!__pwaPrompt) return;
  const p = __pwaPrompt;
  try{
    p.prompt();
    const ch = await p.userChoice.catch(()=>null);
    __pwaPrompt = null;
    if(ch && ch.outcome === 'accepted') installPending();
  }catch(e){}
}
function installPending(){
  toastMsg('설치를 시작했어요! 홈 화면에 아이콘이 생길 때까지 몇 초~1분 정도 걸릴 수 있어요 ⏳');
  clearTimeout(window.__pwaTimer);
  window.__pwaTimer = setTimeout(installStuckModal, 90000);
}
function installStuckModal(){
  const ov = document.createElement('div');
  ov.className = 'modal-ov';
  ov.innerHTML = `<div class="modal" style="max-width:360px">
    <div class="modal-h"><b>⏳ 설치가 늦어지나요?</b><button class="modal-x" onclick="history.back()">✕</button></div>
    <div class="modal-b" style="font-size:14px;line-height:1.9">
      안드로이드가 앱을 만드는 중이에요. 기기·통신 상태에 따라 <b>몇 분</b>까지 걸리기도 합니다.<br><br>
      계속 <b>설치 중...</b>에 멈춰 있다면:<br>
      1. 크롬을 <b>완전히 종료</b>했다가 다시 열기<br>
      2. 5분쯤 뒤에 다시 설치 시도<br>
      3. 그래도 안 되면 <b>휴대폰 재부팅</b> 후 시도<br>
      <span style="color:var(--dim);font-size:12.5px">※ 앱을 삭제한 직후에는 시스템 반영에 시간이 걸려 설치가 유독 오래 걸릴 수 있어요.</span>
    </div></div>`;
  ov.onclick = e => { if(e.target===ov) history.back(); };
  pushModal(ov);
}
async function pwaInstallClick(){
  if(__pwaPrompt){
    await doPrompt();
    return;
  }
  if(__isKakao){
    // 카카오톡 인앱 브라우저 → 외부 브라우저로 자동 이동 (설치는 외부 브라우저에서만 가능)
    let url = location.href.split('#')[0];
    url += (url.includes('?') ? '&' : '?') + 'install=1';
    if(/android/i.test(navigator.userAgent)){
      location.href = 'intent://' + url.replace(/^https?:\/\//,'') + '#Intent;scheme=https;package=com.android.chrome;end';
    }else{
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
    }
    return;
  }
  const ov = document.createElement('div');
  ov.className = 'modal-ov';
  ov.innerHTML = `<div class="modal" style="max-width:360px">
    <div class="modal-h"><b>📱 홈 화면에 앱 설치</b><button class="modal-x" onclick="history.back()">✕</button></div>
    <div class="modal-b" style="font-size:14px;line-height:1.9">

function route(){
  if (!sb){ if(!isConfigured()){renderSetup();return;} }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  gmToken++; gmClear();
  const h = location.hash || '#/';
  const seg = h.replace(/^#\//,'').split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on'));
  const mark = k => { const el=document.querySelector(`[data-nav="${k}"]`); if(el) el.classList.add('on'); };
  document.body.classList.remove('has-votebar');
  window.scrollTo(0,0);
  if (seg[0]==='' )            { mark('home');    viewHome(); }
  else if (seg[0]==='t')       { viewTournament(decodeURIComponent(seg[1]||'')); }
  else if (seg[0]==='fighters'){ mark('fighters'); viewFighters(); }
  else if (seg[0]==='ranking') { mark('ranking'); viewRanking(); }
  else if (seg[0]==='game')    { mark('game'); viewGame(seg[1]||''); }
  else if (seg[0]==='player')  { viewPlayer(decodeURIComponent(seg[1]||'')); }
  else if (seg[0]==='admin')   { viewAdmin(); }
  else viewHome();
}

/* ---------- 공용 유틸 ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + (String(d).length<=10 ? 'T00:00:00' : ''));
  return dt.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
}
function fmtDT(d){
  return new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
}
function countdownText(deadline){
  const ms = new Date(deadline).getTime() - svrNow().getTime();
  if (ms<=0) return null;
  const m = Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  if (d>0) return `${d}일 ${h}시간 남음`;
  if (h>0) return `${h}시간 ${mm}분 남음`;
  return `${mm}분 남음`;
}
function cdHTML(deadline){
  const cd = countdownText(deadline);
  if(!cd) return '';
  const urgent = new Date(deadline).getTime() - svrNow().getTime() < 3600000; // 1시간 미만
  return `<span class="countdown${urgent?' urgent':''}">⏰ ${cd}</span>`;
}
function tState(t){
  if (new Date(t.deadline).getTime() > svrNow().getTime()) return 'open';
  return t.finalized ? 'final' : 'wait';
}
function stateBadge(t){
  const s = tState(t);
  if (s==='open')  return `<span class="badge live">🔵 투표중</span>`;
  if (s==='wait')  return `<span class="badge wait">⏳ 결과 대기</span>`;
  return `<span class="badge done">🏁 결과 확정</span>`;
}
function loading(){ $app.innerHTML = `<div class="empty">불러오는 중…</div>`; }
function fail(e){ $app.innerHTML = `<div class="empty">⚠️ 데이터를 불러오지 못했습니다.<br><span style="font-size:12px">${esc(e?.message||e||'')}</span></div>`; }

async function fetchAll(){
  const [t, p] = await Promise.all([
    sb.from('tournaments').select('*').order('deadline',{ascending:false}),
    sb.from('participants').select('tournament_id')
  ]);
  if (t.error) throw t.error;
  const counts = {};
  (p.data||[]).forEach(r=>counts[r.tournament_id]=(counts[r.tournament_id]||0)+1);
  return { list: t.data||[], counts };
}
async function fetchTournament(id){
  const [t, m, p] = await Promise.all([
    sb.from('tournaments').select('*').eq('id',id).single(),
    sb.from('matches').select('*').eq('tournament_id',id).order('seq'),
    sb.from('participants').select('id,tournament_id,nickname,picks,created_at,updated_at').eq('tournament_id',id).order('created_at')
  ]);
  if (t.error) throw t.error;
  return { t:t.data, matches:m.data||[], parts:p.data||[] };
}

/* ---------- 채점 ---------- */
function scoredMatches(matches){ return matches.filter(m=>m.winner==='A'||m.winner==='B'); }
function scoreOf(part, matches){
  const sm = scoredMatches(matches);
  let hit=0;
  sm.forEach(m=>{ if(part.picks[m.id]===m.winner) hit++; });
  return {hit, total:sm.length};
}
function rankParts(parts, matches){
  const rows = parts.map(p=>({ ...p, ...scoreOf(p,matches) }));
  rows.sort((a,b)=> b.hit-a.hit || new Date(a.updated_at)-new Date(b.updated_at));
  // 공동 순위: 같은 적중 수면 같은 순위, 다음 순위는 건너뛰지 않고 바로 이어짐 (1,2,2,3...)
  let last=null, rank=0;
  rows.forEach(r=>{
    if(r.hit!==last){ rank++; last=r.hit; }
    r.rank = rank;
  });
  return rows;
}
// 순위 표시 칩 (공동 여부 자동 표기)
function rankChips(rows){
  const cnt={}; rows.forEach(r=>cnt[r.rank]=(cnt[r.rank]||0)+1);
  return r=>{
    if(r.rank===1) return '<span class="medal-e">🥇</span>';
    if(r.rank===2) return '<span class="medal-e">🥈</span>';
    return `<span class="rk ${r.rank===3?'r3':''}">${r.rank}등</span>`;
  };
}
function pickStats(match, parts){
  let a=0,b=0;
  parts.forEach(p=>{ const v=p.picks[match.id]; if(v==='A')a++; else if(v==='B')b++; });
  const tot=a+b;
  return { a, b, tot, pa: tot? Math.round(a/tot*100):50, pb: tot? 100-Math.round(a/tot*100):50 };
}

/* ---------- 홈 ---------- */
let homeLimit = 10; // 지난 대회 한 번에 보여줄 개수 (더보기로 확장)
function moreDone(){ homeLimit += 10; viewHome(); }
async function viewHome(){
  loading();
  let d; try{ d = await fetchAll(); }catch(e){ return fail(e); }
  const open  = d.list.filter(t=>tState(t)==='open').sort((x,y)=>new Date(x.deadline)-new Date(y.deadline));
  const wait  = d.list.filter(t=>tState(t)==='wait').sort((x,y)=>new Date(y.deadline)-new Date(x.deadline));
  const done  = d.list.filter(t=>tState(t)==='final').sort((x,y)=>new Date(y.deadline)-new Date(x.deadline));
  const card = t=>{
    const cd = countdownText(t.deadline);
    return `<a class="t-card ${tState(t)}" href="#/t/${t.id}">
      <div class="tt">${esc(t.title)} &nbsp;${stateBadge(t)}</div>
      <div class="meta">
        ${t.event_date?`<span>📅 ${fmtDate(t.event_date)}</span>`:''}
        <span>👥 ${d.counts[t.id]||0}명 참여</span>
        ${cd?cdHTML(t.deadline):`<span>🔒 ${fmtDT(t.deadline)} 마감</span>`}
      </div></a>`;
  };
  $app.innerHTML = `
    ${open.length?`<div class="sec-title">🔥 진행 중인 승부예측</div>${open.map(card).join('')}`:''}
    ${!open.length&&!wait.length&&!done.length?`<div class="empty">아직 등록된 대회가 없습니다.<br>관리자 페이지에서 첫 대회를 만들어 보세요!</div>`:''}
    ${!open.length&&(wait.length||done.length)?`<div class="empty" style="padding:22px 0">지금 진행 중인 투표가 없습니다.</div>`:''}
    ${wait.length?`<div class="sec-title">⏳ 결과 대기</div>${wait.map(card).join('')}`:''}
    ${done.length?`<div class="sec-title">🏁 지난 대회 <span style="color:var(--dim);font-size:13px;font-weight:700">최신순 · 총 ${done.length}개</span></div>
      ${done.slice(0,homeLimit).map(card).join('')}
      ${done.length>homeLimit?`<button class="btn wide" style="margin-top:12px" onclick="moreDone()">지난 대회 더보기 (${done.length-homeLimit}개 더 있음)</button>`:''}`:''}`;
}

    if(error){

function parseFighterHTML(raw){
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  doc.querySelectorAll('script,style,noscript').forEach(e=>e.remove());
  // 마크업 구조와 무관하게 텍스트 노드 단위로 수집
  const lines = [];
  const walker = doc.createTreeWalker(doc.body || doc, NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const v = walker.currentNode.nodeValue.trim();
    if(v) lines.push(v);
  }
  const DIVS = ['플라이급','벤텀급','페더급','라이트급','웰터급','미들급','헤비급','언더그라운드','여성부'];
  const recRe = /^(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})$/;
  const flagOf = n => {
    const k = String(n).trim().toLowerCase();
    const cur = (FIGHTER_MAP[k]||{}).flag;
    return (cur && cur !== 'kr') ? cur : (BASE_FLAGS[k] || cur || 'kr');
  };
  const out = [];
  let cur = null, pend = [], pendRank = null, pendBadge = '', pendMove = 0;
  for(const ln of lines){
    const dHit = DIVS.find(d => ln === d || (ln.startsWith(d) && ln.length <= d.length + 12));
    if(dHit){
      if(out.some(o=>o.div===dHit)){ cur = null; continue; }
      cur = {div:dHit, list:[]}; out.push(cur);
      pend = []; pendRank = null; pendBadge = ''; pendMove = 0; continue;
    }
    if(!cur) continue;
    if(/^CHAMPION$/i.test(ln)) continue;
    if(/^(HOT|NEW)$/i.test(ln)){ pendBadge = ln.toUpperCase(); continue; }
    const mvm = ln.match(/^([▲▼])\s*(\d+)$/);
    if(mvm){ pendMove = (mvm[1]==='▲' ? 1 : -1) * parseInt(mvm[2],10); continue; }
    if(/^(UP|DOWN|LIVE)$/i.test(ln)) continue;
    if(/^\d{1,2}$/.test(ln)){ pendRank = parseInt(ln,10); pend = []; continue; }
    const m = ln.match(recRe);
    if(m){
      if(pend.length){
        const nick = pend[0], real = pend[1] || '';
        const rank = pendRank != null ? pendRank : 'C';
        cur.list.push([rank, nick, real, +m[1], +m[2], +m[3], flagOf(nick), pendBadge, pendMove]);
      }
      pend = []; pendRank = null; pendBadge = ''; pendMove = 0; continue;
    }
    if(ln.length <= 30 && !/RANKING|MEDIA|CHAMPION|인스타|instagram|http|블랙컴뱃|BLACK ?COMBAT/i.test(ln)){
      pend.push(ln);
      if(pend.length > 2) pend = pend.slice(-2);
    }
  }
  // 정리: 체급별 정렬(챔피언 먼저) + 챔피언 없으면 공석 표기
  out.forEach(d=>{
    d.list.sort((a,b)=>{
      const ra = a[0]==='C' ? 0 : a[0], rb = b[0]==='C' ? 0 : b[0];
      return ra - rb;
    });
    if(d.list.length && d.list[0][0] !== 'C') d.list.unshift(['C','공석','',0,0,0,'']);
  });
  return out.filter(d=>d.list.filter(f=>f[1]!=='공석').length >= 2);
}

        const L = '<span class="badge" style="background:#fdecec;color:#a51c1c;font-size:11px">패</span>';
        return `<div class="pcard" style="padding:11px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-weight:800;font-size:14px">${esc(nick)} ${r.won?W:L} <span style="color:var(--dim);font-weight:700">vs</span> ${esc(r.opp)} ${r.won?L:W}</span>
          <span style="color:var(--muted);font-size:13px;font-weight:700">우리 방 픽 ${r.pct}%</span>
        </div>
        <div style="font-size:12px;margin-top:2px"><a href="#/t/${r.tid}" onclick="this.closest('.modal-ov').remove()" style="color:var(--dim);font-weight:700">${esc(r.title)}</a></div>
      </div>`;}).join('')}

function gmResetLeft(){
  // 다음 월요일 0시(KST)까지 남은 시간
  const now = svrNow();
  const k = new Date(now.getTime() + 9*3600*1000);
  const day = (k.getUTCDay() + 6) % 7;             // 월=0
  const next = new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate() - day + 7));
  const ms = next.getTime() - k.getTime();
  const d2 = Math.floor(ms/86400000), h2 = Math.floor(ms%86400000/3600000), m2 = Math.floor(ms%3600000/60000);
  return d2 > 0 ? `${d2}일 ${h2}시간` : h2 > 0 ? `${h2}시간 ${m2}분` : `${m2}분`;
}
function gameWeekKey(d){
  // KST 기준 ISO 주차 — DB의 game_current_week()와 동일 규칙
  const t = new Date(d.getTime() + 9*3600*1000);
  const dt = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()));
  const day = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - day + 3);
  const isoYear = dt.getUTCFullYear();
  const jan4 = new Date(Date.UTC(isoYear, 0, 4));
  const week = 1 + Math.round(((dt - jan4)/86400000 - 3 + ((jan4.getUTCDay()+6)%7))/7);
  return isoYear + '-W' + String(week).padStart(2,'0');
}
function gmWeekLabel(wk){
  const m = /^(\d{4})-W(\d{2})$/.exec(wk||''); if(!m) return wk;
  const jan4 = new Date(Date.UTC(+m[1],0,4));
  const mon = new Date(jan4.getTime() - ((jan4.getUTCDay()+6)%7)*86400000 + (+m[2]-1)*7*86400000);
  return `${mon.getUTCFullYear()}년 ${mon.getUTCMonth()+1}월 ${Math.ceil(mon.getUTCDate()/7)}주차`;
}

/* --- 효과음 (Web Audio 실시간 합성) --- */
function gmCtx(){
  if(gmMuted) return null;
  try{
    gmAC = gmAC || new (window.AudioContext || window.webkitAudioContext)();
    if(gmAC.state === 'suspended') gmAC.resume();
    return gmAC;
  }catch(e){ return null; }
}
function gmTone(freq, dur, type, vol, when, slide){
  const ac = gmCtx(); if(!ac) return;
  const t0 = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol || .15, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + .05);
}
function gmNoise(dur, vol, freq, when){
  const ac = gmCtx(); if(!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 900;
  const g = ac.createGain(); g.gain.value = vol || .2;
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(ac.currentTime + (when||0));
}
function gmSnd(k){
  if(gmFast()) return;
  if(k==='bell'){ gmTone(880,.5,'sine',.15); gmTone(1320,.4,'sine',.06); }
  else if(k==='swish'){ gmNoise(.09,.14,2600); }
  else if(k==='perfect'){ gmNoise(.15,.42,650); gmTone(140,.2,'sine',.42,0,75); }
  else if(k==='ding'){ gmTone(1245,.6,'triangle',.22); gmTone(1867,.45,'sine',.1,.01); }
  else if(k==='good'){ gmNoise(.11,.28,700); gmTone(165,.15,'sine',.28,0,95); }
  else if(k==='weak'){ gmNoise(.08,.12,500); gmTone(180,.18,'sine',.1,0,120); }
  else if(k==='fever'){ gmTone(523,.12,'square',.1); gmTone(659,.12,'square',.1,.1); gmTone(784,.12,'square',.1,.2); gmTone(1046,.25,'square',.12,.3); }
  else if(k==='mile'){ gmTone(784,.12,'square',.1); gmTone(1046,.22,'square',.12,.12); }
  else if(k==='cheer'){ gmNoise(.9,.2,1800); }
  else if(k==='over'){ gmTone(523,.16,'square',.1); gmTone(659,.16,'square',.1,.15); gmTone(784,.16,'square',.11,.3); gmTone(1046,.4,'square',.12,.45); }
  else if(k==='count'){ gmTone(980,.05,'square',.04); }
  else if(k==='jump'){ gmTone(430,.12,'square',.07,0,820); }
  else if(k==='jump2'){ gmTone(640,.12,'square',.07,0,1250); }
  else if(k==='coin'){ gmTone(1450,.07,'sine',.12); gmTone(1930,.1,'sine',.08,.05); }
  else if(k==='crash'){ gmNoise(.3,.4,600); gmTone(90,.35,'sine',.4,0,50); }
  else if(k==='near'){ gmNoise(.12,.16,3400); }
}

function gmSpray(x, y, n, big){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 2.5 + Math.random()*(big?6:3.5);
    G.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1.2, life:1, sz:2+Math.random()*3.5,
                  c: Math.random()<.5?'#ffd76e':'#fff', star:Math.random()<.3});
  }
}
function gmDrawParts(ctx){
  for(let i=G.parts.length-1; i>=0; i--){
    const p = G.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += .16; p.life -= .04;
    if(p.life <= 0){ G.parts.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    if(p.star) gmStar(ctx, p.x, p.y, p.sz*2, p.c);
    else{ ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function gmStar(ctx, x, y, r, c){
  ctx.fillStyle = c;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    const rr = i%2 ? r*.42 : r;
    ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fill();
}
function gmRRect(ctx, x, y, w2, h2, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w2, y, x+w2, y+h2, r);
  ctx.arcTo(x+w2, y+h2, x, y+h2, r);
  ctx.arcTo(x, y+h2, x, y, r);
  ctx.arcTo(x, y, x+w2, y, r);
  ctx.closePath(); ctx.fill();
}
function gmRRectS(ctx, x, y, w2, h2, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w2, y, x+w2, y+h2, r);
  ctx.arcTo(x+w2, y+h2, x, y+h2, r);
  ctx.arcTo(x, y+h2, x, y, r);
  ctx.arcTo(x, y, x+w2, y, r);
  ctx.closePath(); ctx.stroke();
}

/* --- 밝은 배경 공통 (마리오파티풍) --- */
function gmBrightBG(ctx, w, h, now, floorY, scroll){
  // 하늘
  const sk = ctx.createLinearGradient(0, 0, 0, floorY);
  sk.addColorStop(0,'#5bc2ff'); sk.addColorStop(.62,'#9fdcff'); sk.addColorStop(1,'#d9f2ff');
  ctx.fillStyle = sk; ctx.fillRect(-40,-40,w+80,floorY+45);
  // 태양
  ctx.fillStyle = 'rgba(255,238,150,.9)';
  ctx.shadowColor = 'rgba(255,220,90,.9)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(w*.84, h*.13, 26, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  // 구름 (2겹 패럴랙스)
  const cloud = (cx, cy, s2, a) => {
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(cx, cy, 14*s2, 0, 7);
    ctx.arc(cx + 15*s2, cy - 6*s2, 11*s2, 0, 7);
    ctx.arc(cx + 30*s2, cy, 13*s2, 0, 7);
    ctx.arc(cx + 15*s2, cy + 5*s2, 12*s2, 0, 7);
    ctx.fill();
  };
  const c1 = (scroll*.12 + now*.004);
  for(let i=0;i<3;i++){
    const cx = w - ((c1 + i*(w*.45)) % (w + 140)) + 60;
    cloud(cx, h*(.10 + i*.07), 1.15, .92);
  }
  const c2 = (scroll*.06 + now*.002);
  for(let i=0;i<3;i++){
    const cx = w - ((c2 + i*(w*.5) + 130) % (w + 140)) + 60;
    cloud(cx, h*(.2 + (i%2)*.09), .8, .7);
  }
  // 언덕 (원경/근경)
  const hill = (off, hh2, color, gap) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-40, floorY);
    for(let x2 = -40; x2 <= w + 60; x2 += 8){
      const ph = (x2 + off) / gap;
      ctx.lineTo(x2, floorY - hh2*(0.55 + 0.45*Math.sin(ph)));
    }
    ctx.lineTo(w + 60, floorY);
    ctx.closePath(); ctx.fill();
  };
  hill(scroll*.18, h*.14, '#8ed77f', 150);
  hill(scroll*.32 + 80, h*.085, '#5fc153', 105);
}
/* 축제 깃발 줄 */
function gmBunting(ctx, w, y0, scroll, gap){
  const colors = ['#ff5a5a','#ffd23e','#4ecdc4','#7f8cff','#ff9e40'];
  const off = scroll % gap;
  for(let x2 = -off - gap; x2 < w + gap; x2 += gap){
    ctx.strokeStyle = 'rgba(120,80,40,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x2, y0); ctx.quadraticCurveTo(x2 + gap/2, y0 + 16, x2 + gap, y0); ctx.stroke();
    for(let i=1;i<=5;i++){
      const t2 = i/6;
      const fx2 = x2 + gap*t2;
      const fy2 = y0 + 16*4*t2*(1-t2);
      ctx.fillStyle = colors[(Math.round(x2/gap)*5 + i) % 5];
      ctx.beginPath();
      ctx.moveTo(fx2 - 6, fy2); ctx.lineTo(fx2 + 6, fy2); ctx.lineTo(fx2, fy2 + 11);
      ctx.closePath(); ctx.fill();
    }
  }
}
/* --- 금빛 꼬마 사자 (2등신 · 선글라스 + 블랙 글러브/팬츠) --- */
/* o: {run, air, airY, pt, padX, padY, dead, deadNow, idleT, baby, stage} */
function gmDrawLion(ctx, x, footY, S, o){
  o = o || {};
  const GOLD = '#ffcf3e', GOLD_D = '#f4a01c', CREAM = '#ffe9b8', LINE = '#8a5a14';
  const BLACK = '#26282e';
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const yo = o.airY || 0;
  const shS = Math.max(.35, 1 - yo/260);
  ctx.fillStyle = `rgba(60,40,10,${.25*shS})`;
  ctx.beginPath(); ctx.ellipse(x + 1*S, footY + 5, 26*S*shS, 6*S*shS, 0, 0, 7); ctx.fill();
  const gy = footY - yo;
  if(o.dead){
    ctx.translate(x, gy - 30*S);
    ctx.rotate(o.dead * 1.4);
    ctx.translate(-x, -(gy - 30*S));
  }
  const bounce = o.run != null ? Math.abs(Math.sin(o.run))*2.5*S : (o.idleT ? Math.sin(o.idleT/300)*1.8*S : 0);
  const bodyY = gy - 22*S - bounce + (o.pt ? o.pt*1.5*S : 0);   // 몸통 중심 (짧은 몸)
  const lean = o.pt ? o.pt*.12 : 0;
  if(lean){ ctx.translate(x, gy); ctx.rotate(lean); ctx.translate(-x, -gy); }
  // ── 꼬리
  ctx.strokeStyle = GOLD_D; ctx.lineWidth = 4.5*S;
  ctx.beginPath();
  ctx.moveTo(x - 14*S, bodyY + 4*S);
  ctx.quadraticCurveTo(x - 27*S, bodyY + 1*S, x - 26*S, bodyY - 10*S);
  ctx.stroke();
  ctx.fillStyle = '#a86a10';
  ctx.beginPath(); ctx.arc(x - 26*S, bodyY - 13*S, 5*S, 0, 7); ctx.fill();
  // ── 다리 (짧고 통통)
  const drawLeg = (lx, ly, fx2, fy2) => {
    ctx.strokeStyle = GOLD; ctx.lineWidth = 8.5*S;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(fx2, fy2); ctx.stroke();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.ellipse(fx2 + 2*S, fy2, 7*S, 5*S, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.ellipse(fx2, fy2 - 1.6*S, 2.6*S, 1.4*S, 0, 0, 7); ctx.fill();
  };
  const hipY2 = bodyY + 10*S;
  if(o.air){
    drawLeg(x - 5*S, hipY2, x - 11*S, gy - 10*S);
    drawLeg(x + 5*S, hipY2, x + 10*S, gy - 13*S);
  }else if(o.run != null){
    const s1 = Math.sin(o.run), s2 = Math.sin(o.run + Math.PI);
    drawLeg(x - 4*S, hipY2, x - 4*S + s1*12*S, gy - Math.max(0, -s1)*7*S - 2*S);
    drawLeg(x + 4*S, hipY2, x + 4*S + s2*12*S, gy - Math.max(0, -s2)*7*S - 2*S);
  }else{
    drawLeg(x - 6*S, hipY2, x - 8*S, gy - 2*S);
    drawLeg(x + 6*S, hipY2, x + 8*S, gy - 2*S);
  }
  // ── 몸통 (동글동글 작게)
  ctx.fillStyle = GOLD;
  ctx.strokeStyle = LINE; ctx.lineWidth = 2*S;
  ctx.beginPath(); ctx.ellipse(x, bodyY, 15*S, 15*S, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(x + 2*S, bodyY + 3*S, 8.5*S, 9*S, 0, 0, 7); ctx.fill();
  // ── 블랙 파이트 팬츠
  ctx.fillStyle = BLACK;
  gmRRect(ctx, x - 14.5*S, bodyY + 4*S, 29*S, 10*S, 5*S);
  ctx.strokeStyle = '#d9a92f'; ctx.lineWidth = 2*S;
  ctx.beginPath(); ctx.moveTo(x - 12.5*S, bodyY + 5.6*S); ctx.lineTo(x + 12.5*S, bodyY + 5.6*S); ctx.stroke();
  // 챔피언 벨트 (stage 4+)
  if(o.stage >= 4){
    ctx.fillStyle = '#ffd23e';
    gmRRect(ctx, x - 14.5*S, bodyY + 2.5*S, 29*S, 4.5*S, 2*S);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, bodyY + 4.7*S, 3.4*S, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c98a0a'; ctx.lineWidth = 1.4*S;
    ctx.beginPath(); ctx.arc(x, bodyY + 4.7*S, 3.4*S, 0, 7); ctx.stroke();
  }
  // ── 머리 (크게! 2등신 핵심)
  const hx = x + (o.pt ? 7*S + o.pt*3*S : 4*S);
  const hy = bodyY - 30*S;
  const HR = 22*S;
  // 갈기
  ctx.fillStyle = GOLD_D;
  ctx.strokeStyle = '#c97e0c'; ctx.lineWidth = 1.6*S;
  for(let i=0;i<10;i++){
    const a = i/10*Math.PI*2 - Math.PI/2 + (o.run != null ? Math.sin(o.run)*.04 : 0);
    ctx.beginPath();
    ctx.arc(hx + Math.cos(a)*(HR*1.02), hy + Math.sin(a)*(HR*1.02), 11.5*S, 0, 7);
    ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = GOLD_D;
  ctx.beginPath(); ctx.arc(hx, hy, HR*1.02, 0, 7); ctx.fill();
  // 아기 단계: 갈기 대신 배냇머리 (stage 0)
  if(o.baby && (o.stage||0) === 0){
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(hx, hy, HR*1.08, 0, 7); ctx.fill();
  }
  // 얼굴
  ctx.fillStyle = GOLD;
  ctx.strokeStyle = LINE; ctx.lineWidth = 2*S;
  ctx.beginPath(); ctx.arc(hx, hy, HR, 0, 7); ctx.fill(); ctx.stroke();
  // 귀
  [[-16,-15],[14,-16]].forEach(([ex,ey])=>{
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(hx + ex*S, hy + ey*S, 6*S, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8930f';
    ctx.beginPath(); ctx.arc(hx + ex*S, hy + ey*S, 3*S, 0, 7); ctx.fill();
  });
  // 볼터치
  ctx.fillStyle = 'rgba(255,140,90,.35)';
  ctx.beginPath(); ctx.ellipse(hx - 13*S, hy + 7*S, 4.5*S, 2.8*S, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx + 15*S, hy + 7*S, 4.5*S, 2.8*S, 0, 0, 7); ctx.fill();
  // 주둥이
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(hx + 4*S, hy + 9*S, 10*S, 7.5*S, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a2a10';
  ctx.beginPath(); ctx.ellipse(hx + 7*S, hy + 6*S, 3*S, 2.4*S, 0, 0, 7); ctx.fill();
  if(o.sad){
    ctx.strokeStyle = '#7a5a20'; ctx.lineWidth = 1.8*S;
    ctx.beginPath(); ctx.arc(hx + 4*S, hy + 13.5*S, 3.6*S, Math.PI + .4, -.4, false); ctx.stroke();
    ctx.fillStyle = '#8fd0ff';
    ctx.beginPath(); ctx.ellipse(hx - 15*S, hy - 1*S, 2.4*S, 3.4*S, 0, 0, 7); ctx.fill();
  }else{
    ctx.strokeStyle = '#7a5a20'; ctx.lineWidth = 1.8*S;
    ctx.beginPath(); ctx.arc(hx + 4*S, hy + 10*S, 4*S, .35, Math.PI - .55); ctx.stroke();
  }
  // 선글라스 (둥근 2렌즈 — 귀여운 로고 스타일)
  if(o.baby && (o.stage||0) < 2){
    ctx.fillStyle = '#2a1c08';
    ctx.beginPath(); ctx.arc(hx - 8*S, hy - 4*S, 3.4*S, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + 9*S, hy - 4.5*S, 3.4*S, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx - 7*S, hy - 5*S, 1.2*S, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + 10*S, hy - 5.5*S, 1.2*S, 0, 7); ctx.fill();
  }else{
    ctx.fillStyle = '#17181c';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.4*S;
    ctx.beginPath(); ctx.arc(hx - 7.5*S, hy - 4*S, 6.4*S, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 8.5*S, hy - 4.5*S, 6.4*S, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#17181c'; ctx.lineWidth = 2.4*S;
    ctx.beginPath(); ctx.moveTo(hx - 1.2*S, hy - 4.2*S); ctx.lineTo(hx + 2.2*S, hy - 4.5*S); ctx.stroke();
    ctx.lineWidth = 2*S;
    ctx.beginPath(); ctx.moveTo(hx - 13.6*S, hy - 5*S); ctx.lineTo(hx - 16.5*S, hy - 6.5*S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx + 14.6*S, hy - 5.5*S); ctx.lineTo(hx + 17.2*S, hy - 7*S); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(hx - 9.5*S, hy - 6.5*S, 2.4*S, 1.4*S, -.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 6.5*S, hy - 7*S, 2.4*S, 1.4*S, -.4, 0, 7); ctx.fill();
  }
  // 왕관 (stage 5)
  if(o.stage >= 5){
    ctx.font = `${Math.round(15*S)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👑', hx, hy - HR*1.35);
    ctx.textBaseline = 'alphabetic';
  }
  if(o.dead){
    for(let i=0;i<3;i++){
      const a2 = (o.deadNow||0)/280 + i*2.1;
      gmStar(ctx, hx + Math.cos(a2)*30*S, hy - HR*1.3 + Math.sin(a2)*5*S, 4.5*S, '#ffb800');
    }
  }
  // ── 팔 + 블랙 글러브 (짧은 팔)
  const glove = (gx2, gy2, r) => {
    ctx.fillStyle = BLACK;
    ctx.strokeStyle = '#0e0f12'; ctx.lineWidth = 1.5*S;
    ctx.beginPath(); ctx.arc(gx2, gy2, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(gx2 - r*.35, gy2 - r*.35, r*.28, r*.16, -.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#d9a92f';
    gmRRect(ctx, gx2 - r*.55, gy2 + r*.6, r*1.1, r*.32, r*.14);
  };
  const showGloves = !o.baby || (o.stage||0) >= 2;
  if(o.pt){
    const sx2 = x + 8*S, sy2 = bodyY - 8*S;
    const fx3 = sx2 + (o.padX - sx2)*o.pt, fy3 = sy2 + (o.padY - sy2)*o.pt;
    ctx.strokeStyle = GOLD; ctx.lineWidth = 7.5*S;
    ctx.beginPath(); ctx.moveTo(sx2, sy2); ctx.lineTo(fx3, fy3); ctx.stroke();
    glove(x - 4*S, bodyY - 10*S, 7*S);
    glove(fx3, fy3, 9.5*S);
  }else{
    const gb = o.idleT ? Math.sin(o.idleT/260)*1.2*S : (o.run != null ? Math.sin(o.run*.5)*1*S : 0);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 7*S;
    ctx.beginPath(); ctx.moveTo(x - 8*S, bodyY - 4*S); ctx.lineTo(x + 13*S, bodyY - 2*S + gb); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 9*S, bodyY - 2*S); ctx.lineTo(x + 6*S, bodyY - 7*S + gb*.7); ctx.stroke();
    if(showGloves){
      glove(x + 7*S, bodyY - 8*S + gb*.7, 6.5*S);
      glove(x + 15*S, bodyY - 2*S + gb, 7.5*S);
    }else{
      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.arc(x + 7*S, bodyY - 8*S + gb*.7, 4.5*S, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 15*S, bodyY - 2*S + gb, 5*S, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

/* --- 포즈 아이콘: 스프라이트+움직인 팔다리로 즉석 렌더 --- */
const gmPoseCache = {};
function gmPoseDataURL(pose){
  if(!gmLionOK) return null;
  if(gmPoseCache[pose]) return gmPoseCache[pose];
  const cv = document.createElement('canvas'); cv.width = 240; cv.height = 240;
  const ctx = cv.getContext('2d');
  try{
    if(pose === 'run'){
      gmLionSprite(ctx, 120, 204, 150, {run: 2.35, flip: true});
      ctx.lineCap='round'; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=9;
      [[10,80,52,80],[2,120,46,120],[14,160,56,160]].forEach(l=>{ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.stroke();});
    }else if(pose === 'punch'){
      gmLionSprite(ctx, 92, 210, 156, {pt:.9, flip:true});
      const sx=92+38, sy=210-64, fx=196, fy=132;
      ctx.lineCap='round';
      ctx.strokeStyle='#241a08'; ctx.lineWidth=21;
      ctx.beginPath(); ctx.moveTo(sx-10,sy+2); ctx.lineTo(fx-6,fy); ctx.stroke();
      ctx.strokeStyle='#f0a333'; ctx.lineWidth=16;
      ctx.beginPath(); ctx.moveTo(sx-10,sy+2); ctx.lineTo(fx-6,fy); ctx.stroke();
      const gg=ctx.createRadialGradient(fx-6,fy-7,3,fx,fy,21);
      gg.addColorStop(0,'#ffd97a'); gg.addColorStop(.55,'#f0a333'); gg.addColorStop(1,'#c07f18');
      ctx.fillStyle=gg; ctx.strokeStyle='#241a08'; ctx.lineWidth=3.5;
      ctx.beginPath(); ctx.arc(fx,fy,21,0,7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='rgba(255,210,60,.9)'; ctx.lineWidth=6; ctx.lineCap='round';
      [[-35],[0],[35]].forEach(a=>{const r=Math.PI*a[0]/180;
        ctx.beginPath(); ctx.moveTo(fx+Math.cos(r)*30,fy+Math.sin(r)*30); ctx.lineTo(fx+Math.cos(r)*46,fy+Math.sin(r)*46); ctx.stroke();});
    }else if(pose === 'jump'){
      gmLionSprite(ctx, 120, 214, 150, {air:true, vy:400, airY:26});
      ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=8; ctx.lineCap='round';
      for(let i=0;i<2;i++){ ctx.beginPath(); ctx.arc(120, 236-i*4, 52-i*18, Math.PI*1.15, Math.PI*1.85); ctx.stroke(); }
    }else{
      gmLionSprite(ctx, 120, 224, 170, {});
    }
    return gmPoseCache[pose] = cv.toDataURL('image/png');
  }catch(e){ return null; }
}

function gmLionLegs(ctx, hh, ww, pose){
  // 몸통 아래에 실제로 움직이는 다리 (스프라이트 하단 잘라내고 그려붙임)

  const leg = (x0, ang, len, bend) => {
    const fx = x0 + Math.sin(ang)*len, fy = hipY + Math.cos(ang)*len;
    const kx = x0 + Math.sin(ang + bend)*len*.55, ky = hipY + Math.cos(ang + bend)*len*.55;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#241a08'; ctx.lineWidth = hh*.105;
    ctx.beginPath(); ctx.moveTo(x0, hipY); ctx.quadraticCurveTo(kx, ky, fx, fy); ctx.stroke();
    ctx.strokeStyle = '#f0a333'; ctx.lineWidth = hh*.075;
    ctx.beginPath(); ctx.moveTo(x0, hipY); ctx.quadraticCurveTo(kx, ky, fx, fy); ctx.stroke();
    ctx.fillStyle = '#f7c159'; ctx.strokeStyle = '#241a08'; ctx.lineWidth = hh*.018;
    ctx.beginPath(); ctx.ellipse(fx, fy, hh*.06, hh*.042, Math.sin(ang)*.4, 0, 7);
    ctx.fill(); ctx.stroke();
  };
  if(pose.mode === 'run'){
    const ph = pose.ph;
    const a = Math.sin(ph)*.95, b = Math.sin(ph + Math.PI)*.95;
    leg(-hx, b, L*(1 - .18*Math.max(0, -Math.sin(ph))), -.55*Math.cos(ph));
    leg(hx, a, L*(1 - .18*Math.max(0, Math.sin(ph))), .55*Math.cos(ph));
  }else if(pose.mode === 'crouch'){
    const q = pose.q; // 1 = 최대 웅크림
    leg(-hx, -.5, L*(1 - .5*q), -.7*q);
    leg(hx, .5, L*(1 - .5*q), .7*q);
  }else if(pose.mode === 'up'){
    leg(-hx, -.95, L*.55, -.9);
    leg(hx, .95, L*.55, .9);
  }else{ // 낙하/공중 중립
    leg(-hx, -.22, L*.95, -.25);
    leg(hx, .22, L*.95, .25);
  }
}
function gmLionSprite(ctx, x, footY, hpx, o){

  const ar = gmLionImg.width / gmLionImg.height;
  const hh = hpx, ww = hh*ar;
  const yo = o.airY || 0;

  ctx.fillStyle = `rgba(60,40,10,${.26*shS})`;
  ctx.beginPath(); ctx.ellipse(x, footY + 5, ww*.42*shS, 6.5, 0, 0, 7); ctx.fill();
  const gy = footY - yo;
  ctx.save();
  ctx.translate(x, gy - hh*.5);

    let rot = 0, sx2 = 1, sy2 = 1, hop = 0;

      const b = Math.abs(Math.sin(o.run));
      rot = Math.sin(o.run)*.12;                       // 몸통 크게 흔들기
      hop = b*7;                                        // 스텝마다 위로 통통

      const s3 = Math.sin(o.idleT/300)*.02;

  }

}

function gmLoop(){
  const tok = gmToken;
  G.lastT = performance.now();
  function frame(){
    if(tok !== gmToken) return;
    const cv = document.getElementById('gCanvas');
    if(!cv){ G.raf = 0; return; }
    const now = performance.now();
    const dt = Math.min(50, now - G.lastT) / 1000;
    G.lastT = now;
    gmCanvasHeal();
    if(G.mode === 'play' && G.state === 'aim'){
      G.p += G.dir * G.speed * dt * 2;
      if(G.p > 1){ G.p = 2 - G.p; G.dir = -1; }
      if(G.p < 0){ G.p = -G.p; G.dir = 1; }
    }
    if(G.dispScore !== G.score){
      const diff = G.score - G.dispScore;
      G.dispScore += Math.abs(diff) < 2 ? diff : diff * Math.min(1, dt*8);
      const s = document.getElementById('gScore');
      if(s) s.innerHTML = `${Math.round(G.dispScore).toLocaleString()}<span>kg</span>`;
    }
    try{ gmDraw(now); }catch(err){}
    G.raf = requestAnimationFrame(frame);
  }
  G.raf = requestAnimationFrame(frame);
}
function gmDraw(now){
  const ctx = G.ctx; if(!ctx) return;
  const w = G.w, h = G.h;
  let sx = 0, sy = 0;
  if(G.shake > 0){
    const el = now - G.shakeT;
    if(el < 320){ const d = G.shake * (1 - el/320); sx = (Math.random()*2-1)*d; sy = (Math.random()*2-1)*d*.7; }
    else G.shake = 0;
  }
  ctx.save();
  ctx.translate(sx, sy);

  if(G.zoomT && now - G.zoomT < 420){
    const q = (now - G.zoomT)/420;

    const zoomS = 1 + ease*.16;
    const zx = G.zoomX || w*.56, zy = G.zoomY || h*.5;

  spot.addColorStop(0,'rgba(255,255,255,.13)'); spot.addColorStop(1,'rgba(255,255,255,0)');

  // 케이지 펜스 (다이아몬드 메쉬)

  const mesh = 30;
  for(let x2 = -h; x2 < w + h; x2 += mesh){
    ctx.beginPath(); ctx.moveTo(x2, 0); ctx.lineTo(x2 + floorY, floorY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2 + floorY, 0); ctx.lineTo(x2, floorY); ctx.stroke();
  }
  // 케이지 상단 프레임 바
  ctx.fillStyle = '#22242b';
  ctx.fillRect(0, 0, w, 10);
  ctx.fillStyle = 'rgba(245,197,66,.5)';
  ctx.fillRect(0, 10, w, 2);
  // 바닥 (블랙 매트)
  const fg = ctx.createLinearGradient(0, floorY, 0, h);
  fg.addColorStop(0,'#1e2026'); fg.addColorStop(1,'#101116');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, w, h - floorY);

    ctx.fillStyle = i%2 ? '#33363f' : '#15161b';
    ctx.fillRect(i*26, floorY, 26, 6);

  gmDrawPuncherLion(ctx, w, h, now, floorY);

  gmDrawParts(ctx);

    const p = (G.flashT - now)/240;
    ctx.fillStyle = G.flashC + (.25*p) + ')';
    ctx.fillRect(0,0,w,h);
  }
}

function runDraw(now, dt){
  const ctx = G.ctx; if(!ctx) return;
  const w = G.w, h = G.h;
  const S = Math.min(w,h)/420;
  const floorY = h*.78;

    const el = now - G.shakeT;

  }
  const scroll = (R.mode==='play' && !R.dead) ? R.dist*22 : now*.02;

  // 축제 깃발
  gmBunting(ctx, w, h*.03, scroll*.5, w*.5);
  // 응원 현수막 (중경)
  const signGap = 640;
  const off2 = scroll*.55;
  for(let k = Math.floor(off2/signGap); k <= Math.floor((off2+w)/signGap)+1; k++){
    const gx = k*signGap - off2;
    if(gx < -160 || gx > w+60) continue;
    // 기둥 + 받침
    ctx.fillStyle = '#8a6a3f';
    ctx.fillRect(gx - 1, floorY - 92, 8, 92);

    ctx.fillStyle = 'rgba(60,40,10,.18)';
    gmRRect(ctx, gx - 63, floorY - 126, 138, 44, 11);
    ctx.fillStyle = '#17120c';
    gmRRect(ctx, gx - 66, floorY - 130, 138, 44, 11);
    ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
    gmRRectS(ctx, gx - 66, floorY - 130, 138, 44, 11);
    ctx.strokeStyle = 'rgba(245,197,66,.35)'; ctx.lineWidth = 1.5;
    gmRRectS(ctx, gx - 61, floorY - 125, 128, 34, 8);
    ctx.font = `900 15px 'Jua','Pretendard Variable',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f5c542';
    const memes = ['이어서~','WHO IS THE KING?!','쪼여! 쪼여!','보너스 주십시오','검정님 어디 계십니까?','얌바!','앤 뉴~!'];
    ctx.fillText(memes[((k % 7) + 7) % 7], gx + 3, floorY - 103);
  }
  // 도로
  const rg = ctx.createLinearGradient(0, floorY, 0, h);
  rg.addColorStop(0,'#e9c377'); rg.addColorStop(1,'#c99b53');
  ctx.fillStyle = rg; ctx.fillRect(0, floorY, w, h - floorY);
  // 연석 스트라이프
  const curbOff = scroll % 52;
  for(let i=-1;i<Math.ceil(w/26)+1;i++){
    ctx.fillStyle = (i + Math.floor(scroll/26)) % 2 ? '#ffffff' : '#ff6b5e';
    ctx.fillRect(i*26 - (scroll % 26), floorY, 26, 6);
  }
  // 차선 대시
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  for(let i=0;i<Math.ceil(w/86)+2;i++){
    const gx = i*86 - (scroll % 86);
    ctx.fillRect(gx, floorY + (h-floorY)*.5, 40, 5);

    if(c.got) return;
    const spin = Math.abs(Math.sin(now/170 + c.x/40));
    const r = 11*S;
    ctx.save();
    ctx.translate(c.x, floorY - c.yo);
    ctx.scale(.35 + .65*spin, 1);
    const cg2 = ctx.createRadialGradient(-r*.3, -r*.3, r*.2, 0, 0, r);
    cg2.addColorStop(0,'#fff3b0'); cg2.addColorStop(.7,'#f2b722'); cg2.addColorStop(1,'#c98a0a');
    ctx.fillStyle = cg2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#a8730a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,110,10,.7)'; ctx.lineWidth = 2;

  });
  // 사자 러너!
  gmLionSprite(ctx, w*.2, floorY, 86*S, {

    air: R.y > 0.5,
    airY: R.y,
    vy: R.vy,

  if(R.mode==='play' && !R.dead && R.speed > 430){
    ctx.strokeStyle = `rgba(255,255,255,${Math.min(.4,(R.speed-430)/700)})`;

  }
}

function jumpSpawnRow(){
  // y는 "바닥에서의 높이" 좌표 (위로 갈수록 큼)
  const w = G.w || 390;
  const hgt = J.nextY;
  const m = J.maxCam/22;
  const pw = Math.max(64, 86 - m*.05);
  // 이전 발판에서 좌우로 도달 가능한 범위 안에서만 다음 발판을 배치 → 화면에 항상 발판이 보이고 항상 닿을 수 있다

  let px2;

    px2 = 14 + Math.random()*(w - pw - 28);
  }else{
    const lo = Math.max(10, J.lastPX - reach), hi = Math.min(w - pw - 10, J.lastPX + reach);
    px2 = lo + Math.random()*Math.max(10, hi - lo);
  }

  const r = Math.random();
  const mv = Math.min(.24, m*.0009);
  const br = Math.min(.26, .06 + m*.0008);

  else if(r < .08 + mv) type = 'm';

  if(Math.random() < .3) J.coins.push({x:px2 + pw/2, y:hgt + 42, got:false});

function gmDrawCloudPad(ctx, bx, py, pw, kind, dir){

    {x: bx + pw*.24,       y: cy + R*.1,  r: R*.92},
    {x: bx + pw*.46,       y: cy - R*.22, r: R*1.05},
    {x: bx + pw*.68,       y: cy + R*.08, r: R*.98},
    {x: bx + pw - R*.5,    y: cy + R*.38, r: R*.58},

  // 상단 하이라이트 (볼록한 광택)

  // 이동 발판: 은은한 파란 테두리 글로우 + 방향 화살표
  if(kind === 'm'){
    ctx.save();
    ctx.shadowColor = 'rgba(37,99,235,.55)'; ctx.shadowBlur = 6;

    ctx.restore();
    ctx.fillStyle = '#2563eb';
    ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

function jumpDraw(now){

  const mix = (c1,c2,t2)=>[lerp(c1[0],c2[0],t2),lerp(c1[1],c2[1],t2),lerp(c1[2],c2[2],t2)];

      ctx.beginPath(); ctx.moveTo(bx2-6, by2); ctx.quadraticCurveTo(bx2-2, by2-4, bx2, by2);

      ctx.fillStyle = '#c9915a';
      gmRRect(ctx, bx - 4, py + q*60, half, 11, 5);
      gmRRect(ctx, bx + half + 4, py + q*80, half, 11, 5);
      ctx.globalAlpha = dim;
      continue;
    }
    if(p.type === 's'){
      // 스프링 발판 (골드 3D + 코일)
      const sq = J.sprT && now - J.sprT < 200 ? .45 : 1;
      ctx.fillStyle = '#b3791a';
      gmRRect(ctx, bx + 1, py + 9, p.w - 2, 6, 3);
      const gld = ctx.createLinearGradient(0, py, 0, py + 11);
      gld.addColorStop(0,'#ffd75e'); gld.addColorStop(1,'#e8a41b');
      ctx.fillStyle = gld;
      gmRRect(ctx, bx, py, p.w, 11, 5);
      ctx.strokeStyle = '#8a5c0a'; ctx.lineWidth = 1.6;
      gmRRectS(ctx, bx, py, p.w, 11, 5);
      // 코일 + 발사대
      const cx3 = bx + p.w/2;
      ctx.strokeStyle = '#9aa0ad'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      for(let k2=0;k2<3;k2++){
        ctx.moveTo(cx3 - 8, py - 2 - k2*4*sq);
        ctx.lineTo(cx3 + 8, py - 4 - k2*4*sq);
      }
      ctx.stroke();
      ctx.fillStyle = '#e14434';
      gmRRect(ctx, cx3 - 11, py - 8 - 12*sq, 22, 7, 3);
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillRect(bx + 3, py + 1.5, p.w - 6, 2.2);
    }else if(p.type === 'b'){
      // 갈라진 나무 발판 (판자 + 결)
      ctx.fillStyle = '#7a4a1a';
      gmRRect(ctx, bx + 1, py + 8, p.w - 2, 6, 3);
      const wd = ctx.createLinearGradient(0, py, 0, py + 10);
      wd.addColorStop(0,'#d8a468'); wd.addColorStop(1,'#b3793f');
      ctx.fillStyle = wd;
      gmRRect(ctx, bx, py, p.w, 10, 4);
      ctx.strokeStyle = '#6b3c10'; ctx.lineWidth = 1.5;
      gmRRectS(ctx, bx, py, p.w, 10, 4);
      ctx.strokeStyle = 'rgba(107,60,16,.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(bx + 5, py + 3.5); ctx.lineTo(bx + p.w*.4, py + 3.5);
      ctx.moveTo(bx + p.w*.55, py + 6.5); ctx.lineTo(bx + p.w - 5, py + 6.5);
      ctx.stroke();
      ctx.strokeStyle = '#4a2808'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(bx + p.w*.46, py); ctx.lineTo(bx + p.w*.52, py + 4); ctx.lineTo(bx + p.w*.44, py + 10);
      ctx.stroke();
    }else if(p.type === 'm'){
      gmDrawCloudPad(ctx, bx, py, p.w, 'm', p.dir);       // 이동 구름 발판
    }else{
      gmDrawCloudPad(ctx, bx, py, p.w, 'n');              // 일반 구름 발판
    }
  }
  // 코인
  for(const c of J.coins){
    const cy2 = h - (c.y - J.cam);
    if(cy2 < -20 || cy2 > h + 20) continue;
    const spin = Math.abs(Math.sin(now/170 + c.x/40));
    const r = 10*S;
    ctx.save();
    ctx.translate(c.x, cy2);
    ctx.scale(.35 + .65*spin, 1);
    const cg2 = ctx.createRadialGradient(-r*.3, -r*.3, r*.2, 0, 0, r);
    cg2.addColorStop(0,'#fff3b0'); cg2.addColorStop(.7,'#f2b722'); cg2.addColorStop(1,'#c98a0a');
    ctx.fillStyle = cg2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#a8730a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
    ctx.restore();
  }
  // 사자 (스프라이트, 이동 방향 바라보기)
  if(J.mode !== 'idle'){
    const ly = h - (J.y - J.cam);
    J.lastFlip = J.vx > 20 ? true : (J.vx < -20 ? false : (J.lastFlip !== undefined ? J.lastFlip : true));
    gmLionSprite(ctx, J.x, ly, 76*S, {
      air: true, vy: J.vy,
      dead: J.dead ? Math.min(1, (now - J.deadT)/380) : 0,
      landT: J.landT && now - J.landT < 150 ? (now - J.landT)/150 : 0,
      flip: J.lastFlip,
    });
  }
  ctx.restore();
  gmDrawParts(ctx);
  ctx.restore();
  if(G.flashT > now){
    const p = (G.flashT - now)/300;
    ctx.fillStyle = G.flashC + (.3*p) + ')';
    ctx.fillRect(0,0,w,h);
  }
  // 좌우 이동 힌트 (첫 10m)
  if(J.mode === 'play' && !J.dead && J.maxCam/22 < 10){
    ctx.font = `900 ${Math.round(w*.04)}px 'Jua','Pretendard Variable',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(37,99,235,.6)';
    ctx.fillText('◀ 왼쪽 누름', w*.2, h*.94);
    ctx.fillText('오른쪽 누름 ▶', w*.8, h*.94);
  }
}

function gmOverPanel(o){
  if(gmCurGame === 'run') R.mode = 'over'; else G.mode = 'over';
  gmSnd('over');
  const ov = document.getElementById('gOver');
  if(ov){
    ov.style.display = '';
    ov.innerHTML = `
      <div class="go-ko">${o.title}</div>
      <div class="go-score" id="goScore">0</div>
      ${o.cmp ? `<div class="go-cmp">${o.cmp}</div>` : ''}

      <div class="go-stats">${o.stats}</div>
      <button class="g-start" id="gRetry">한 판 더!</button>`;
    const rb = document.getElementById('gRetry');
    if(rb){ rb.onpointerdown = e=>e.stopPropagation(); rb.onclick = e => { e.stopPropagation(); o.retry(); }; }
    const t0 = performance.now(), dur = 1000, target = o.score;
    let lastTick = 0;
    (function tick(){
      const e2 = document.getElementById('goScore'); if(!e2) return;
      const now2 = performance.now();
      const p = Math.min(1, (now2-t0)/dur);
      e2.innerHTML = Math.round(target * (1-Math.pow(1-p,3))).toLocaleString() + `<span>${o.unit}</span>`;
      if(now2 - lastTick > 70){ gmSnd('count'); lastTick = now2; }
      if(p<1) requestAnimationFrame(tick);
      else if(o.cheer) gmSnd('cheer');
    })();
  }
  gmAutoSubmit(o);
}

async function loadGameRank(wk, game){
  const box = document.getElementById('gRank'), hall = document.getElementById('gHall');
  if(!box) return;
  const unit = game === 'punch' ? 'kg' : '점';
  try{
    const {data:all, error} = await sb.from('game_scores').select().eq('game', game).order('score', {ascending:false});
    if(error) throw error;
    window.gmRankAll = all || []; window.gmRankGame = game; window.gmRankUnit = unit;
    const rows = (all||[]).filter(r=>r.week===wk);
    if(!rows.length){
      box.innerHTML = '<div class="empty">아직 이번 주 기록이 없습니다.<br>첫 번째 도전자가 되어보세요!</div>';
    }else{
      const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위';
      const top = +rows[0].score || 1;
      box.innerHTML = rows.slice(0,20).map((r,i)=>{
        const me = gmMyNick && r.nickname === gmMyNick;
        const pct = Math.max(5, Math.round(+r.score / top * 100));
        const sub2 = game === 'run'
          ? `🏃 ${(r.combo||0).toLocaleString()}m · 🪙 ${r.kos||0}개`
          : game === 'grow'
          ? `Lv.${r.kos||0} 달성 · 🔥${r.combo||0}콤보`
          : `🔥최대 ${r.combo||0}콤보`;
        return `<div class="grank-row ${i===0?'top1':''}${me?' me':''}">
          <span class="gr-medal">${medal(i)}</span>
          <div class="gr-wrap">
            <div class="gr-nick"><span class="gr-nk" data-n="${esc(r.nickname)}" onclick="gmShowHist(this.dataset.n)">${esc(r.nickname)}</span>${me?' <span style="font-size:11px;color:var(--key-deep)">나</span>':''}
              <span style="font-size:11px;color:var(--dim);font-weight:600">${sub2}</span></div>
            <div class="gr-bar"><span class="gr-fill" style="width:${pct}%"></span></div>
          </div>
          <span style="font-weight:900;color:${i===0?'#c62828':'var(--text)'}">${(+r.score).toLocaleString()}<span style="font-size:11px;color:var(--dim)">${unit}</span></span>
        </div>`;
      }).join('') + (rows.length>20 ? `<div class="note" style="margin-top:6px">외 ${rows.length-20}명</div>` : '');
    }
    // 지난 주 TOP3 (히스토리)
    const prevWk = gameWeekKey(new Date(svrNow().getTime() - 7*86400000));
    const prev = (all||[]).filter(r=>r.week===prevWk).slice(0,3);
    if(prev.length){
      const pm = ['🥇','🥈','🥉'];
      box.innerHTML += `<div class="grk-prev">
        <div class="gp-t">📜 지난 주 랭킹 (${gmWeekLabel(prevWk)})</div>
        ${prev.map((r,i)=>`<div class="gp-r"><span>${pm[i]}</span><b><span class="gr-nk" data-n="${esc(r.nickname)}" onclick="gmShowHist(this.dataset.n)">${esc(r.nickname)}</span></b><span style="font-weight:800">${(+r.score).toLocaleString()}${unit}</span></div>`).join('')}
      </div>`;
    }
    if(hall && all && all.length){
      const b = all[0];
      hall.style.display = '';
      hall.innerHTML = `<div style="font-size:13.5px">🏛️ <b>명예의 전당</b> — 역대 최고 기록 <b class="gr-nk" data-n="${esc(b.nickname)}" onclick="gmShowHist(this.dataset.n)">${esc(b.nickname)}</b> · <b style="color:#c62828">${(+b.score).toLocaleString()}${unit}</b> <span style="color:var(--dim)">(${gmWeekLabel(b.week)})</span></div>`;
    }
  }catch(e){
    box.innerHTML = '<div class="empty">랭킹을 불러오지 못했습니다.<br>관리자가 미니게임_패치4.sql을 실행해야 사용할 수 있어요.</div>';
  }
}

/* --- 닉네임 클릭: 주차별 히스토리 --- */
function gmShowHist(nick){
  const all = window.gmRankAll || [], unit = window.gmRankUnit || '점';
  const rows = all.filter(r => r.nickname === nick).sort((a,b) => a.week < b.week ? 1 : -1);
  if(!rows.length) return;
  const best = Math.max(...rows.map(r => +r.score || 0));
  const total = rows.reduce((s,r) => s + (+r.score||0), 0);
  const game = window.gmRankGame;
  const sub = r => game === 'run' ? `🏃 ${(r.combo||0).toLocaleString()}m` : game === 'grow' ? `🔥${r.combo||0}콤보` : `🔥${r.combo||0}콤보`;
  const ov = document.createElement('div');
  ov.className = 'ghist-ov';
  ov.innerHTML = `<div class="ghist">
    <div class="ghist-h">👤 <b>${esc(nick)}</b><button class="ghist-x" onclick="this.closest('.ghist-ov').remove()">✕</button></div>
    <div class="ghist-sum">주차별 히스토리 · 참여 <b>${rows.length}주</b> · 누적 <b>${total.toLocaleString()}${unit}</b> · 최고 <b>${best.toLocaleString()}${unit}</b></div>
    ${rows.map(r => `<div class="ghist-r ${+r.score===best?'best':''}">
      <span class="hw">${gmWeekLabel(r.week)}</span>
      ${+r.score===best?'<span>👑</span>':''}
      <span style="font-size:11.5px;color:var(--dim)">${sub(r)}</span>
      <span class="hs">${(+r.score).toLocaleString()}${unit}</span>
    </div>`).join('')}
  </div>`;
  ov.onclick = ev => { if(ev.target === ov) ov.remove(); };
  document.body.append(ov);
}

  const mid = btn.dataset.mid, side = btn.dataset.side;
  if(voteSel[mid] === side){
    // 같은 버튼 재클릭 → 선택 해제
    delete voteSel[mid];
    btn.classList.remove('sel');
  } else {
    voteSel[mid] = side;
    document.querySelectorAll(`.corner[data-mid="${mid}"]`).forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
  }
  const c = document.getElementById('vb-count');
  if(c) c.textContent = Object.keys(voteSel).length;
}
function prefillPicks(tid){
  // 기존 참가자면 투표 내용 미리 채워주기 (수정 편의)
  const nick = document.getElementById('v-nick').value.trim().toLowerCase();
  if(!nick) return;
  sb.from('participants').select('nickname,picks').eq('tournament_id',tid).then(({data})=>{
    const me = (data||[]).find(p=>p.nickname.trim().toLowerCase()===nick);
    if(me){
      voteSel = {};
      curMatches.forEach(m=>{ if(me.picks[m.id]) voteSel[m.id] = me.picks[m.id]; });
      document.querySelectorAll('.corner[data-mid]').forEach(b=>{
        b.classList.toggle('sel', voteSel[b.dataset.mid]===b.dataset.side);
      });
      toastMsg(`'${me.nickname}'님의 기존 투표를 불러왔어요. 수정 후 비밀번호와 함께 제출하세요.`);
    }
  });
}
async function submitVote(tid, matchCount){
  const nick = document.getElementById('v-nick').value.trim();
  const pin  = document.getElementById('v-pin').value.trim();
  const msg  = document.getElementById('v-msg');
  const show = (cls, s)=>{ msg.className='msg '+cls; msg.textContent=s; msg.scrollIntoView({block:'center',behavior:'smooth'}); };
  if(!nick) return show('err','닉네임을 입력해 주세요.');
  if(!/^[0-9]{4}$/.test(pin)) return show('err','비밀번호는 숫자 4자리로 입력해 주세요.');
  if(Object.keys(voteSel).length < matchCount) return show('err', `모든 경기에 투표해야 제출할 수 있습니다. 현재 ${matchCount}경기 중 ${Object.keys(voteSel).length}경기만 선택하셨어요.`);
  const btn = document.getElementById('vb-submit'); btn.disabled=true;
  try{
    const {data, error} = await sb.rpc('submit_picks',{p_tournament:tid,p_nickname:nick,p_pin:pin,p_picks:voteSel});
    if (error) return show('err', cleanErr(error.message));
    if (data && data.ok===false) return show('err', data.error);
    show('ok', data.is_new ? `✅ ${data.nickname}님의 투표가 등록되었습니다!` : `✅ ${data.nickname}님의 투표가 수정되었습니다!`);
    setTimeout(()=>viewTournament(tid), 900);
  } finally { btn.disabled=false; }
}

function liveBoardHTML(t, matches, parts, st){
  const hasResult = st==='final' || matches.some(m=>m.winner);
  // 이변 계산: 적중률이 가장 낮은 경기
  const rateOf = m => {
    if(!(m.winner==='A'||m.winner==='B')) return null;
    const s = pickStats(m, parts);
    return s.tot ? (m.winner==='A'? s.a : s.b) / s.tot : null;
  };
  let upsetId = null, minRate = 1.01;
  if(parts.length) matches.forEach(m=>{ const r = rateOf(m); if(r!==null && r < minRate){ minRate = r; upsetId = m.id; } });
  const bars = st==='open' ? '' : matches.map(m=>{
    const winA = m.winner==='A', winB = m.winner==='B';
    const r = rateOf(m);
    let tag = '';
    if(r!==null){
      if(m.id===upsetId && r<0.5) tag = `<span class="badge" style="background:#fdecec;color:#a51c1c;font-size:11px">😱 최대 이변 · ${Math.round(r*100)}%만 적중</span>`;
      else if(r===1) tag = '<span class="badge" style="background:#e0f3e6;color:#116131;font-size:11px">🎯 전원 적중</span>';
      else if(r===0) tag = '<span class="badge" style="background:#e6eaf0;color:#525d6b;font-size:11px">💀 전원 실패</span>';
    }
    let hitters = '';
    if(m.id===upsetId && r!==null && r>0 && r<0.35){
      const names = parts.filter(p=>p.picks[m.id]===m.winner).map(p=>p.nickname);
      if(names.length<=10) hitters = `<div class="note" style="margin-top:6px;font-size:12.5px">이변 적중 ${names.length}명: <b>${names.map(esc).join(', ')}</b></div>`;
    }
    return `<div class="match">
      <div class="no"><span>${m.seq}경기 ${m.winner==='X'?'<span class="badge done">무효/무승부</span>':''} ${tag}</span>
        ${hasResult&&(winA||winB)?`<span class="wintag">🏆 ${esc(winA?m.fighter_a:m.fighter_b)} 승</span>`:''}</div>
      <div class="split" onclick="openMatchVoters('${m.id}')" style="cursor:pointer" title="누가 투표했는지 보기">${splitInner(m, parts, hasResult)}</div>${hitters}</div>`;
  }).join('');

  return `
    ${st!=='open' && parts.length ? `<div class="sec-title" style="justify-content:space-between">경기 결과
      ${st==='wait'?'<button class="btn-parts" onclick="openPartsModal()">참가자 예측 현황</button>':''}</div>

      <div class="vote-grid">${bars}</div>` : ''}
    <div style="display:none"><div class="pf-scope" id="pf-area">${partsAreaHTML(matches, parts, st)}</div></div>`;
}

/* ---------- 시즌 랭킹 / 개인 페이지 ---------- */
async function fetchSeasonData(){
  const [t, m, p] = await Promise.all([
    sb.from('tournaments').select('*').eq('finalized',true),
    sb.from('matches').select('*'),
    sb.from('participants').select('id,tournament_id,nickname,picks,created_at,updated_at')
  ]);
  if(t.error) throw t.error;
  const finals = t.data||[];
  const fids = new Set(finals.map(x=>x.id));
  const matchesBy={}, partsBy={};
  (m.data||[]).forEach(x=>{ (matchesBy[x.tournament_id]=matchesBy[x.tournament_id]||[]).push(x); });
  Object.values(matchesBy).forEach(a=>a.sort((x,y)=>x.seq-y.seq));
  (p.data||[]).forEach(x=>{ if(fids.has(x.tournament_id)) (partsBy[x.tournament_id]=partsBy[x.tournament_id]||[]).push(x); });
  return {finals: finals.sort((a,b)=>new Date(b.deadline)-new Date(a.deadline)), matchesBy, partsBy};
}
const WIN_TITLES  = [[5,'👑 예측의 신'],[4,'🤖 적중 머신'],[3,'😎 격잘알'],[2,'🔥 예측 좀 치네']];
const LOSE_TITLES = [[4,'☠️ 반대로만 찍어'],[3,'👎 역배 장인'],[2,'🥵 감다뒤'],[1,'💩 꼴등']];
// 대회 시간순으로 연속 우승/연속 꼴등 최고 기록 계산 (대회를 건너뛰면 연속 끊김)
function computeStreaks(d){
  const asc = d.finals.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const cur = {}, best = {};
  asc.forEach(t=>{
    const parts = d.partsBy[t.id]||[];
    if(!parts.length) return;
    const ranked = rankParts(parts, d.matchesBy[t.id]||[]);
    const maxRank = Math.max(...ranked.map(r=>r.rank));
    const winners = new Set(ranked.filter(r=>r.rank===1).map(r=>r.nickname.trim().toLowerCase()));
    const losers  = new Set(maxRank>1 ? ranked.filter(r=>r.rank===maxRank).map(r=>r.nickname.trim().toLowerCase()) : []);
    const nicks   = ranked.map(r=>r.nickname.trim().toLowerCase());
    nicks.forEach(n=>{
      const c = cur[n] = cur[n]||{w:0,l:0};
      c.w = winners.has(n) ? c.w+1 : 0;
      c.l = losers.has(n)  ? c.l+1 : 0;
      const b = best[n] = best[n]||{w:0,l:0};
      b.w = Math.max(b.w, c.w); b.l = Math.max(b.l, c.l);
    });
    Object.keys(cur).forEach(n=>{ if(!nicks.includes(n)){ cur[n].w=0; cur[n].l=0; } });
  });
  return best;
}
function badgesFor(a, streaks){
  const s = streaks[a.nickname.trim().toLowerCase()] || {w:0,l:0};
  const b = [];
  const w = WIN_TITLES.find(x=>s.w>=x[0]);
  if(w) b.push([w[1], `연속 ${s.w}회 우승`, 'w']);
  const l = LOSE_TITLES.find(x=>s.l>=x[0]);
  if(l) b.push([l[1], s.l>1?`연속 ${s.l}회 꼴등`:'꼴등 1회', 'l']);
  return b;
}
function badgeChip(b, big){
  return `<span class="ubadge${b[2]==='l'?' lose':''}" ${big?'style="font-size:12.5px;padding:4px 10px"':''} title="${b[1]}" onclick="event.preventDefault();event.stopPropagation();toastMsg('${b[0]} — ${b[1]}')">${b[0]}</span>`;

function buildSeason(d){
  // 닉네임(소문자 기준)별 통합 전적
  const agg = {};
  d.finals.forEach(t=>{
    const matches = d.matchesBy[t.id]||[];
    const parts = d.partsBy[t.id]||[];
    if(!parts.length) return;
    const ranked = rankParts(parts, matches);
    ranked.forEach(r=>{
      const k = r.nickname.trim().toLowerCase();
      const a = agg[k] = agg[k]||{nickname:r.nickname, plays:0, wins:0, hit:0, total:0, records:[]};
      a.plays++; a.hit+=r.hit; a.total+=r.total;
      if(r.rank===1) a.wins++;
      a.records.push({t, rank:r.rank, hit:r.hit, total:r.total, entrants:parts.length});
    });
  });
  return Object.values(agg);
}

function levDist(a, b){
  if(Math.abs(a.length-b.length) > 3) return 99;
  const m = Array.from({length:a.length+1}, (_,i)=>[i, ...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) m[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
function suggestFighters(v){
  const n = normName(v);
  if(!n) return [];
  return Object.values(FIGHTER_MAP).map(f=>{
    const fn = normName(f.nick);
    let s;
    if(fn === n) s = 0;
    else if(fn.includes(n) || n.includes(fn)) s = 1 + Math.abs(fn.length - n.length)*0.1;
    else s = 2 + levDist(fn, n);
    return {nick:f.nick, s};
  }).filter(x=>x.s <= 4).sort((a,b)=>a.s-b.s).slice(0,4).map(x=>x.nick);
}

async function saveAllMatches(tid){
  const box = document.getElementById('mx-'+tid);
  const rows = [...box.querySelectorAll('.mrow[data-mid]')];
  const changed = rows.filter(r=>{
    const [a,b] = r.querySelectorAll('input');
    return a.value.trim() !== a.dataset.orig || b.value.trim() !== b.dataset.orig;
  });
  if(!changed.length) return toastMsg('변경된 내용이 없습니다.');
  let ok = 0;
  for(const r of changed){
    const [a,b] = r.querySelectorAll('input');
    if(!a.value.trim() || !b.value.trim()){ toastMsg('⚠️ 선수 이름이 비어 있는 경기가 있습니다.'); return; }
    const ck = validateFighterNames([a.value.trim(), b.value.trim()]);
    if(!ck.ok){ toastMsg(`⚠️ 랭킹에 없는 선수: ${ck.bad.join(', ')}`); return; }
    a.value = ck.fixed[0]; b.value = ck.fixed[1];
    const {error} = await sb.rpc('admin_update_match',{p_pass:adminPass(), p_mid:r.dataset.mid, p_a:a.value.trim(), p_b:b.value.trim()});
    if(error) return matchErr(error);
    a.dataset.orig = a.value.trim(); b.dataset.orig = b.value.trim();
    flashEl(r); ok++;
  }
  toastMsg(`✅ ${ok}개 경기가 저장되었습니다.`);
}

  if(box.innerHTML){ box.innerHTML=''; return; }
  const {data:t, error} = await sb.from('tournaments').select('*').eq('id',tid).single();
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  const d = new Date(t.deadline), pad = n=>String(n).padStart(2,'0');
  const dlVal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  box.innerHTML = `<hr class="sep">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:700;color:var(--muted)">경기 시작일</span>
      <input type="datetime-local" id="evi-${tid}" value="${t.event_date? t.event_date+'T00:00' : ''}" style="background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--text)">
      <span style="font-size:13px;font-weight:700;color:var(--muted)">투표 마감</span>
      <input type="datetime-local" id="dli-${tid}" value="${dlVal}" style="background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--text)">
      <button class="btn primary small" onclick="saveDeadline('${tid}')">저장</button>
    </div>`;
}
async function saveDeadline(tid){
  const v = document.getElementById('dli-'+tid).value;
  const ev = document.getElementById('evi-'+tid).value;
  if(!v) return toastMsg('⚠️ 마감 시각을 선택해 주세요.');
  const {error} = await sb.rpc('admin_update_tournament',{
    p_pass:adminPass(), p_tid:tid, p_title:null, p_event_date: ev? ev.slice(0,10) : null, p_deadline:new Date(v).toISOString()});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('일정이 변경되었습니다.');
  route();
  setTimeout(()=>flashEl(document.getElementById('dls-'+tid)), 900);
}
async function delTournament(tid, title){
  if(!confirm(`'${title}' 대회를 삭제할까요?\n투표 기록도 함께 삭제되며 되돌릴 수 없습니다.`)) return;
  const {error} = await sb.rpc('admin_delete_tournament',{p_pass:adminPass(), p_tid:tid});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('삭제되었습니다.');
  route();
}
async function changePass(){
  const nw = document.getElementById('p-new').value;
  if(nw.length<4) return toastMsg('⚠️ 새 비밀번호는 4자 이상이어야 합니다.');
  const {error} = await sb.rpc('admin_change_password',{p_old:adminPass(), p_new:nw});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  sessionStorage.setItem('fp_admin', nw);
  toastMsg('관리자 비밀번호가 변경되었습니다.');
}

boot();
</script>
</body>
</html>
