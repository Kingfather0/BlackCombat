<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔥블랙컴뱃 잡담방🔥 승부예측</title>
<meta property="og:title" content="🔥블랙컴뱃 잡담방🔥 승부예측">
<meta property="og:description" content="블랙컴뱃 승부예측 투표 · 자동 집계 · 격잘알 랭킹">
<meta property="og:image" content="https://kingfather0.github.io/BlackCombat/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kingfather0.github.io/BlackCombat/">
<meta name="description" content="격투기 승부예측 투표 · 자동 집계 · 랭킹">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --card2:#eef2f8; --border:#d8dfe9;
  --text:#1b2430; --muted:#525d6b; --dim:#818c9b;
  --key:#2563eb; --key-deep:#1d4ed8; --key-soft:#e8effd;
  --red:#c62828; --blue:#2563eb; --green:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;
  line-height:1.65; font-size:16px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 80px}
/* header */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:3px solid var(--key);box-shadow:0 1px 6px rgba(20,40,80,.07)}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-weight:900;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;color:var(--text)}
.logo img{width:38px;height:38px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.logo small{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:0}
nav{display:flex;gap:4px}
nav a{padding:8px 13px;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--muted)}
nav a.on{background:var(--key);color:#fff}
nav a:hover:not(.on){background:var(--card2);color:var(--text)}
/* common */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.sec-title{font-size:17px;font-weight:800;color:var(--text);margin:32px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:4px solid var(--key);padding-left:10px}
h1.page{font-size:24px;font-weight:900;margin-top:24px;line-height:1.35}
.sub{color:var(--muted);font-size:14.5px;margin-top:6px}
.badge{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;vertical-align:2px}
.badge.live{background:var(--key-soft);color:var(--key-deep)}
.badge.rt{background:#e0f3e6;color:#116131}
.badge.wait{background:#fdf0cd;color:#7c5a06}
.badge.done{background:#fdecec;color:#a51c1c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:11px 18px;font-weight:800;font-size:15px;transition:.15s;color:var(--text)}
.btn:hover{border-color:var(--key);background:#f8faff}
.btn.primary{background:var(--key);border:1.5px solid var(--key-deep);color:#fff}
.btn.primary:hover{background:var(--key-deep)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.wide{width:100%;padding:15px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin-top:12px}
.field label{display:block;font-size:13.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 13px;color:var(--text);outline:none;font-size:16px}
.field input:focus{border-color:var(--key)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:700;display:none}
.msg.err{display:block;background:#fdecec;color:#a51c1c;border:1px solid #f2bcbc}
.msg.ok{display:block;background:#e0f3e6;color:#116131;border:1px solid #b3ddc0}
.empty{color:var(--dim);text-align:center;padding:36px 0;font-size:15px}
.center{text-align:center}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
/* home cards */
.t-card{display:block;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--key);border-radius:12px;padding:16px;margin-top:12px;transition:.15s;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.t-card:hover{filter:brightness(.985)}
.t-card .tt{font-size:17.5px;font-weight:800}
.t-card .meta{display:flex;gap:14px;color:var(--muted);font-size:14px;margin-top:8px;flex-wrap:wrap}
.countdown{color:#c62828;font-weight:800}
/* match voting */
.match{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.match .no{font-size:14px;font-weight:900;color:var(--text);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.vs-row{display:grid;grid-template-columns:1fr 36px 1fr;align-items:stretch;gap:5px}
.corner{border-radius:10px;padding:14px 6px;font-weight:800;font-size:16px;border:1.5px solid var(--border);background:#fff;color:var(--text);transition:.12s;word-break:keep-all;line-height:1.35}
.corner.red.sel{background:var(--red);border-color:#a51c1c;color:#fff}
.corner.blue.sel{background:#2563eb;border-color:#1d43a8;color:#fff}
.corner:not(.sel):hover{border-color:var(--key)}
.corner .cn{display:block;font-size:10.5px;font-weight:900;letter-spacing:1px;margin-bottom:2px}
.corner.red .cn{color:var(--red)}
.corner.blue .cn{color:#2563eb}
.corner.sel .cn{color:#fff;opacity:.85}
.vs{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--dim)}
.wintag{font-size:13px;font-weight:900;color:var(--text)}
/* split bar */
.split{margin-top:11px}
.split .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:5px}
.split .lbl .a{color:#a51c1c}.split .lbl .b{color:#1d43a8}
.split .bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#e3e8f0}
.split .bar i{display:block;height:100%}
.split .bar .ia{background:#d64545}
.split .bar .ib{background:#3b66d6}
/* tables */
.tbl-scroll{overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 4px rgba(20,40,80,.06)}
table{border-collapse:collapse;width:100%;font-size:15px;white-space:nowrap}
th,td{padding:11px 12px;border-bottom:1px solid #e8ecf2;text-align:center}
th{background:var(--card2);font-size:13.5px;color:#334052;font-weight:800;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.nick,th.nick{text-align:left;position:sticky;left:0;background:var(--card);font-weight:800;max-width:150px;overflow:hidden;text-overflow:ellipsis}
th.nick{background:var(--card2)}
.pick-chip{display:inline-block;min-width:48px;padding:3px 8px;border-radius:7px;font-weight:800;font-size:13.5px}
.pick-chip.A{background:#fdeaea;color:#a51c1c}
.pick-chip.B{background:#e3ebfb;color:#1c47a8}
.pick-chip.hit{background:var(--key);color:#fff}
.pick-chip.miss{opacity:.4;text-decoration:line-through}
.rank-1{font-weight:900}
/* 닉네임 링크 (누르면 전적 페이지) */
.plink{color:var(--text);text-decoration:none;font-weight:800}
.plink::after{content:'전적';margin-left:5px;font-size:10.5px;font-weight:800;color:var(--key-deep);background:var(--key-soft);padding:1.5px 7px;border-radius:99px;vertical-align:2px}
.plink:hover::after{background:var(--key);color:#fff}
/* 순위 칩 */
.rk{display:inline-block;min-width:44px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13.5px;background:#eef1f6;color:var(--muted)}
.medal-e{font-size:21px;line-height:1}
.rk.r3{background:#e6eaf0;color:#334052}
/* 숫자 칩 (표 안 수치 강조) */
.stat-chip{display:inline-block;min-width:46px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13.5px;background:#f1f4f8;color:#334052}
.stat-chip.b{background:var(--key-soft);color:var(--key-deep)}
.stat-chip.dash{background:transparent;color:#b3bcc7}
/* stats chips */
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--key);border-radius:12px;padding:13px;text-align:center;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.tile .v{font-size:22px;font-weight:900}
.tile .k{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.note{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.7}
footer{margin-top:60px;padding:22px 0;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:13px}
footer a{color:var(--dim);text-decoration:underline}
/* winner hero */
.hero{background:linear-gradient(170deg,#eef3ff,#ffffff);border:1.5px solid var(--key) !important}
/* admin */
.admin-t{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;background:var(--card);box-shadow:0 1px 4px rgba(20,40,80,.06)}
.admin-t .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.res-btn{padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:800;color:var(--text)}
.res-btn.selA{background:var(--red);border-color:#a51c1c;color:#fff}
.res-btn.selB{background:#2563eb;border-color:#1d43a8;color:#fff}
.res-btn.selX{background:#525d6b;border-color:#3d4650;color:#fff}
.res-row{display:grid;grid-template-columns:1fr 1fr 64px;gap:6px;margin-top:8px}
.mrow{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:7px;align-items:center;margin-top:8px}
.mrow input{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:10px 11px;color:var(--text);width:100%;outline:none}
.del-x{color:var(--dim);font-size:17px;text-align:center}
.del-x:hover{color:#a51c1c}
/* setup screen */
.setup{max-width:560px;margin:60px auto;padding:0 16px}
.setup code{background:var(--card2);border:1px solid var(--border);padding:2px 7px;border-radius:6px;font-size:13px;color:var(--key-deep)}
.setup ol{margin:14px 0 0 20px;display:grid;gap:8px;font-size:14px}
.match{padding:11px 13px;margin-top:8px}
.corner{padding:10px 6px;font-size:15px}
.fmeta{display:block;font-size:11px;font-weight:700;margin-top:3px;opacity:.9}
.votebar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--key);z-index:60;box-shadow:0 -4px 16px rgba(20,40,80,.12)}
.votebar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
.votebar .cnt{font-weight:800;font-size:15px}
.votebar .cnt b{color:var(--key-deep);font-size:17px}
body.has-votebar .wrap{padding-bottom:160px}
.hero2{background:linear-gradient(170deg,#f1f5f9,#ffffff);border:1.5px solid #94a3b8 !important}
.fpick{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;background:#fff}
.fpick:hover{border-color:var(--key);background:#f8faff}
#fp-div{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px}
/* 선수 랭킹 그리드 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;margin-top:14px}
.fdiv{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.fdiv-t{font-weight:900;color:var(--key-deep);font-size:14.5px;border-bottom:2px solid var(--key);padding-bottom:6px;margin-bottom:6px}
.frow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f0f2f6;font-size:13px}
.frow:last-child{border-bottom:none}
.frk{min-width:24px;text-align:center;font-weight:800;color:var(--muted);font-size:11.5px;background:#eef1f6;border-radius:6px;padding:1px 0;flex-shrink:0}
.frk.c{background:var(--key);color:#fff}
.fnm{font-size:13px;flex:1;font-weight:800;line-height:1.25;word-break:keep-all}
.frec{color:var(--dim);font-size:11.5px;font-weight:700;flex-shrink:0}
.flag{vertical-align:-2px;border-radius:2px;flex-shrink:0}
/* 1·2등 포디움 */
.prow{display:flex;align-items:center;gap:13px;padding:12px 8px;background:transparent}
.prow.p2{border-top:1px solid #eef1f6}
.pmd{font-size:32px;line-height:1;flex-shrink:0}
.plab{display:block;font-size:10.5px;font-weight:900;letter-spacing:2px}
.prow.p1 .plab{color:#b08a1e}
.prow.p2 .plab{color:#64788f}
.pnames{display:block;font-weight:900;font-size:17.5px;min-width:0;word-break:keep-all;color:var(--text)}
.pscore{font-weight:800;font-size:13px;flex-shrink:0;color:var(--muted)}
/* 참가자 예측 카드 */
.pcard{background:#fff;border:1px solid var(--border);border-radius:11px;margin-top:8px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,80,.05)}
.pcard-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:15px;text-align:left}
.pcard-h:hover{background:#f8faff}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{color:var(--dim);font-size:12px;font-weight:700;flex-shrink:0}
.pcard-b{padding:2px 14px 12px;border-top:1px solid #eef1f6}
.pchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pchip{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.pchip i{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:700}
/* 닉네임/비밀번호 카드 압축 */
.vform{padding:11px 14px 12px}
.vform .field{margin-top:0}
.vform .field label{font-size:11.5px;margin-bottom:4px}
.vform .field input{padding:9px 11px;font-size:15px}
.vform .note{margin-top:8px;font-size:12px;line-height:1.5}
/* 투표 카드 압축 그리드 */
.vote-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
@media(min-width:600px){.vote-grid{grid-template-columns:1fr 1fr}}
.vote-grid .match{margin-top:0;padding:10px 12px}
.vote-grid .match .no{font-size:12px;margin-bottom:5px;color:var(--muted)}
.vote-grid .corner{padding:9px 4px;font-size:14px}
.vote-grid .fmeta{font-size:10px;margin-top:2px}
.vote-grid .split{margin-top:6px}
.vote-grid .split .lbl{font-size:12px;margin-bottom:3px;font-weight:800}
.vote-grid .split .bar{height:8px}
/* 칭호 배지 */
.ubadge{display:inline-block;font-size:10.5px;font-weight:800;background:#f4f0e2;color:#7a5c10;border:1px solid #e6d9b0;border-radius:99px;padding:1.5px 8px;vertical-align:1px;white-space:nowrap;cursor:help}
.ubadge.lose{background:#fdecec;color:#a51c1c;border-color:#f0c4c4}
/* 규칙 안내 */
.rule{padding:10px 0;border-bottom:1px dashed #eef1f6;font-size:14px;line-height:1.65}
.rule:last-child{border-bottom:none}
/* 선물 관련 */
.gift-name{display:inline-block;background:#fff;border:1.5px solid #dcbf6a;border-radius:8px;padding:2px 10px;font-weight:800;color:#26200f;margin:2px 3px 2px 0;font-size:14px}
.gift-banner{border:1.5px solid #e6c34d !important;background:#fffaf0 !important}
/* 참가자 예측 현황 버튼 (입체) */
.btn-parts{background:var(--key);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13.5px;box-shadow:0 2px 6px rgba(37,99,235,.28);transition:.15s;cursor:pointer;letter-spacing:.2px}
.btn-parts:hover{background:var(--key-deep);box-shadow:0 4px 10px rgba(37,99,235,.35)}
.btn-parts:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(37,99,235,.3)}
/* 경기별 투표자 팝업 */
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mv-col{background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px}
.mv-h{font-weight:900;font-size:14.5px;padding-bottom:7px;border-bottom:1.5px solid #eef1f6;margin-bottom:6px;word-break:keep-all}
.mv-h.a{color:#a51c1c}.mv-h.b{color:#1d43a8}
.mv-h span{color:var(--dim);font-weight:700;font-size:12px}
.mv-names{display:flex;flex-wrap:wrap;gap:5px}
.mv-n{display:inline-block;padding:3px 9px;background:#f2f5f9;border-radius:7px;font-weight:700;font-size:13px}
/* 참가자 예측 팝업 */
.modal-ov{position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:82vh;border-radius:0 0 16px 16px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(10,20,40,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);font-size:16px;flex-shrink:0}
.modal-x{font-size:18px;color:var(--muted);padding:4px 10px}
.modal-b{overflow-y:auto;padding:0 14px 24px}
/* 부드러운 전환 */
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
#app > *{animation:fadeUp .26s ease both}
.modal-ov{animation:ovIn .16s ease}
.modal{animation:modalIn .22s ease}
.votebar{animation:fadeUp .3s ease}
@media(prefers-reduced-motion:reduce){#app > *,.modal-ov,.modal,.votebar{animation:none}}
@media(max-width:480px){
  .tile{padding:11px 5px}
  .tile .v{font-size:16px}
  .tile .k{font-size:11px}
  .logo small{display:none}
  .logo{font-size:16px}
  th,td{padding:10px 9px}
}
</style>
</head>
<body>

const SUPABASE_URL      = "https://dbtzakbmyfmqudjiycoj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xtTqzRYwBZBUQyeqHhHVcA_CG2e-1fA";
/* ================================================================ */

/* ---------- 초기화 ---------- */
const $app = document.getElementById('app');
let sb = null;            // supabase client
let timeOffset = 0;       // 서버시간 - 내시간 (ms)
let pollTimer = null;     // 자동 새로고침 타이머

function isConfigured(){
  return !SUPABASE_URL.includes('여기에') && !SUPABASE_ANON_KEY.includes('여기에');
}
function svrNow(){ return new Date(Date.now() + timeOffset); }

async function boot(){
  if (window.__TEST_SB) { sb = window.__TEST_SB; }
  else if (!isConfigured()){ renderSetup(); return; }
  else {
    if (typeof supabase === 'undefined'){
      $app.innerHTML = '<div class="empty">네트워크 문제로 페이지를 불러오지 못했습니다.<br>잠시 후 새로고침(F5) 해주세요.</div>';
      return;
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  try{
    const {data} = await sb.rpc('server_now');
    if (data) timeOffset = new Date(data).getTime() - Date.now();
  }catch(e){}
  // 선수 랭킹: 자동 갱신 파일(fighters.json)과 수동 갱신(DB) 중 더 최신 데이터 사용
  let cand = [];
  try{
    const r = await fetch('fighters.json?ts=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && Array.isArray(j.divisions) && j.divisions.length >= 5) cand.push({d:j.divisions, t:j.updated_at});
    }
  }catch(e){}
  try{
    const {data} = await sb.from('site_data').select('value,updated_at').eq('key','fighters').single();
    if(data && data.value && Array.isArray(data.value.divisions) && data.value.divisions.length >= 5)
      cand.push({d:data.value.divisions, t:data.updated_at});
  }catch(e){}
  if(cand.length){
    cand.sort((a,b)=>new Date(b.t||0)-new Date(a.t||0));
    FIGHTERS = cand[0].d;
    fightersUpdatedAt = cand[0].t;
    buildFighterMap();
const BASE_FLAGS = {};
Object.entries(FIGHTER_MAP).forEach(([k,f])=>{ if(f.flag && f.flag!=='kr') BASE_FLAGS[k]=f.flag; });
  }
  route();
}
window.addEventListener('hashchange', route);

function renderSetup(){
  $app.innerHTML = `
  <div class="setup">
    <h1 class="page">⚙️ 초기 설정이 필요합니다</h1>
    <p class="sub" style="margin-top:10px">아직 데이터베이스 연결 정보가 입력되지 않았습니다.<br>함께 받은 <b>설치가이드</b> 문서의 순서대로 진행해 주세요.</p>
    <div class="card">
      <ol>
        <li>supabase.com 에서 무료 프로젝트 생성</li>
        <li>SQL Editor에 <code>setup.sql</code> 내용 실행</li>
        <li>이 파일(index.html)을 열어 상단의 <code>SUPABASE_URL</code> 과 <code>SUPABASE_ANON_KEY</code> 값 붙여넣기</li>
        <li>무료 호스팅(Netlify 등)에 업로드 후 카톡방에 링크 공유</li>
      </ol>
    </div>
  </div>`;
}

/* ---------- 라우터 ---------- */
function route(){
  if (!sb){ if(!isConfigured()){renderSetup();return;} }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  const h = location.hash || '#/';
  const seg = h.replace(/^#\//,'').split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on'));
  const mark = k => { const el=document.querySelector(`[data-nav="${k}"]`); if(el) el.classList.add('on'); };
  document.body.classList.remove('has-votebar');
  window.scrollTo(0,0);
  if (seg[0]==='' )            { mark('home');    viewHome(); }
  else if (seg[0]==='t')       { viewTournament(decodeURIComponent(seg[1]||'')); }
  else if (seg[0]==='fighters'){ mark('fighters'); viewFighters(); }
  else if (seg[0]==='ranking') { mark('ranking'); viewRanking(); }
  else if (seg[0]==='player')  { viewPlayer(decodeURIComponent(seg[1]||'')); }
  else if (seg[0]==='admin')   { viewAdmin(); }
  else viewHome();
}

/* ---------- 공용 유틸 ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + (String(d).length<=10 ? 'T00:00:00' : ''));
  return dt.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
}
function fmtDT(d){
  return new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
}
function countdownText(deadline){
  const ms = new Date(deadline).getTime() - svrNow().getTime();
  if (ms<=0) return null;
  const m = Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  if (d>0) return `${d}일 ${h}시간 남음`;
  if (h>0) return `${h}시간 ${mm}분 남음`;
  return `${mm}분 남음`;
}
function cdHTML(deadline){
  const cd = countdownText(deadline);
  if(!cd) return '';
  const urgent = new Date(deadline).getTime() - svrNow().getTime() < 3600000; // 1시간 미만
  return `<span class="countdown${urgent?' urgent':''}">⏰ ${cd}</span>`;
}
function tState(t){
  if (new Date(t.deadline).getTime() > svrNow().getTime()) return 'open';
  return t.finalized ? 'final' : 'wait';
}
function stateBadge(t){
  const s = tState(t);
  if (s==='open')  return `<span class="badge live">🔵 투표중</span>`;
  if (s==='wait')  return `<span class="badge wait">⏳ 결과 대기</span>`;
  return `<span class="badge done">🏁 결과 확정</span>`;
}
function loading(){ $app.innerHTML = `<div class="empty">불러오는 중…</div>`; }
function fail(e){ $app.innerHTML = `<div class="empty">⚠️ 데이터를 불러오지 못했습니다.<br><span style="font-size:12px">${esc(e?.message||e||'')}</span></div>`; }

async function fetchAll(){
  const [t, p] = await Promise.all([
    sb.from('tournaments').select('*').order('deadline',{ascending:false}),
    sb.from('participants').select('tournament_id')
  ]);
  if (t.error) throw t.error;
  const counts = {};
  (p.data||[]).forEach(r=>counts[r.tournament_id]=(counts[r.tournament_id]||0)+1);
  return { list: t.data||[], counts };
}
async function fetchTournament(id){
  const [t, m, p] = await Promise.all([
    sb.from('tournaments').select('*').eq('id',id).single(),
    sb.from('matches').select('*').eq('tournament_id',id).order('seq'),
    sb.from('participants').select('id,tournament_id,nickname,picks,created_at,updated_at').eq('tournament_id',id).order('created_at')
  ]);
  if (t.error) throw t.error;
  return { t:t.data, matches:m.data||[], parts:p.data||[] };
}

/* ---------- 채점 ---------- */
function scoredMatches(matches){ return matches.filter(m=>m.winner==='A'||m.winner==='B'); }
function scoreOf(part, matches){
  const sm = scoredMatches(matches);
  let hit=0;
  sm.forEach(m=>{ if(part.picks[m.id]===m.winner) hit++; });
  return {hit, total:sm.length};
}
function rankParts(parts, matches){
  const rows = parts.map(p=>({ ...p, ...scoreOf(p,matches) }));
  rows.sort((a,b)=> b.hit-a.hit || new Date(a.updated_at)-new Date(b.updated_at));
  // 공동 순위: 같은 적중 수면 같은 순위, 다음 순위는 건너뛰지 않고 바로 이어짐 (1,2,2,3...)
  let last=null, rank=0;
  rows.forEach(r=>{
    if(r.hit!==last){ rank++; last=r.hit; }
    r.rank = rank;
  });
  return rows;
}
// 순위 표시 칩 (공동 여부 자동 표기)
function rankChips(rows){
  const cnt={}; rows.forEach(r=>cnt[r.rank]=(cnt[r.rank]||0)+1);
  return r=>{
    if(r.rank===1) return '<span class="medal-e">🥇</span>';
    if(r.rank===2) return '<span class="medal-e">🥈</span>';
    return `<span class="rk ${r.rank===3?'r3':''}">${r.rank}등</span>`;
  };
}
function pickStats(match, parts){
  let a=0,b=0;
  parts.forEach(p=>{ const v=p.picks[match.id]; if(v==='A')a++; else if(v==='B')b++; });
  const tot=a+b;
  return { a, b, tot, pa: tot? Math.round(a/tot*100):50, pb: tot? 100-Math.round(a/tot*100):50 };
}

/* ---------- 홈 ---------- */
let homeLimit = 10; // 지난 대회 한 번에 보여줄 개수 (더보기로 확장)
function moreDone(){ homeLimit += 10; viewHome(); }
async function viewHome(){
  loading();
  let d; try{ d = await fetchAll(); }catch(e){ return fail(e); }
  const open  = d.list.filter(t=>tState(t)==='open').sort((x,y)=>new Date(x.deadline)-new Date(y.deadline));
  const wait  = d.list.filter(t=>tState(t)==='wait').sort((x,y)=>new Date(y.deadline)-new Date(x.deadline));
  const done  = d.list.filter(t=>tState(t)==='final').sort((x,y)=>new Date(y.deadline)-new Date(x.deadline));
  const card = t=>{
    const cd = countdownText(t.deadline);
    return `<a class="t-card ${tState(t)}" href="#/t/${t.id}">
      <div class="tt">${esc(t.title)} &nbsp;${stateBadge(t)}</div>
      <div class="meta">
        ${t.event_date?`<span>📅 ${fmtDate(t.event_date)}</span>`:''}
        <span>👥 ${d.counts[t.id]||0}명 참여</span>
        ${cd?cdHTML(t.deadline):`<span>🔒 ${fmtDT(t.deadline)} 마감</span>`}
      </div></a>`;
  };
  $app.innerHTML = `
    ${open.length?`<div class="sec-title">🔥 진행 중인 승부예측</div>${open.map(card).join('')}`:''}
    ${!open.length&&!wait.length&&!done.length?`<div class="empty">아직 등록된 대회가 없습니다.<br>관리자 페이지에서 첫 대회를 만들어 보세요!</div>`:''}
    ${!open.length&&(wait.length||done.length)?`<div class="empty" style="padding:22px 0">지금 진행 중인 투표가 없습니다.</div>`:''}
    ${wait.length?`<div class="sec-title">⏳ 결과 대기</div>${wait.map(card).join('')}`:''}
    ${done.length?`<div class="sec-title">🏁 지난 대회 <span style="color:var(--dim);font-size:13px;font-weight:700">최신순 · 총 ${done.length}개</span></div>
      ${done.slice(0,homeLimit).map(card).join('')}
      ${done.length>homeLimit?`<button class="btn wide" style="margin-top:12px" onclick="moreDone()">지난 대회 더보기 (${done.length-homeLimit}개 더 있음)</button>`:''}`:''}`;
}

/* ── 선수 랭킹 자동 갱신 (관리자) ── */
async function refreshFighters(btn){
  btn.disabled = true; btn.textContent = '갱신 중...';
  try{
    const target = 'https://www.blackcombat-official.com/ranking.php?type=fighter';
    const proxies = [
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
      'https://corsproxy.io/?url=' + encodeURIComponent(target)
    ];
    let raw = null;
    for(const p of proxies){
      try{
        const r = await fetch(p, {cache:'no-store'});
        if(r.ok){ const t = await r.text(); if(t && t.length > 5000){ raw = t; break; } }
      }catch(e){}
    }
    if(!raw) throw new Error('공식 사이트에 접속하지 못했습니다.');
    const parsed = parseFighterHTML(raw);
    const total = parsed.reduce((n,d)=>n+d.list.filter(f=>f[1]!=='공석').length, 0);
    if(parsed.length < 5 || total < 40) throw new Error('페이지 구조가 바뀌어 자동 분석에 실패했습니다.');
    const {error} = await sb.rpc('admin_save_data',{p_pass:adminPass(), p_key:'fighters', p_value:{divisions:parsed}});
    if(error){
      if(/function|not find/i.test(error.message||'')) throw new Error('랭킹갱신_패치.sql을 먼저 실행해 주세요.');
      throw new Error(cleanErr(error.message));
    }
    FIGHTERS = parsed; fightersUpdatedAt = new Date().toISOString();
    buildFighterMap(); seasonCache = null;
    toastMsg(`✅ 선수 랭킹이 갱신되었습니다. (${parsed.length}개 체급 · ${total}명)`);
    viewFighters();
  }catch(e){
    toastMsg('⚠️ ' + (e.message||'갱신에 실패했습니다.') + ' 실패가 반복되면 클로드에게 수동 갱신을 요청하세요.');
    btn.disabled = false; btn.textContent = '🔄 수동 갱신';
  }
}
function parseFighterHTML(raw){
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  doc.querySelectorAll('script,style,noscript').forEach(e=>e.remove());
  // 마크업 구조와 무관하게 텍스트 노드 단위로 수집
  const lines = [];
  const walker = doc.createTreeWalker(doc.body || doc, NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const v = walker.currentNode.nodeValue.trim();
    if(v) lines.push(v);
  }
  const DIVS = ['플라이급','벤텀급','페더급','라이트급','웰터급','미들급','헤비급','언더그라운드','여성부'];
  const recRe = /^(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})$/;
  const flagOf = n => {
    const k = String(n).trim().toLowerCase();
    const cur = (FIGHTER_MAP[k]||{}).flag;
    return (cur && cur !== 'kr') ? cur : (BASE_FLAGS[k] || cur || 'kr');
  };
  const out = [];
  let cur = null, pend = [], pendRank = null;
  for(const ln of lines){
    const dHit = DIVS.find(d => ln === d || (ln.startsWith(d) && ln.length <= d.length + 12));
    if(dHit){
      if(out.some(o=>o.div===dHit)){ cur = null; continue; }
      cur = {div:dHit, list:[]}; out.push(cur);
      pend = []; pendRank = null; continue;
    }
    if(!cur) continue;
    if(/^CHAMPION$/i.test(ln)) continue;
    if(/^(HOT|NEW|UP|DOWN|LIVE|[▲▼]\s*\d*)$/i.test(ln)) continue;
    if(/^\d{1,2}$/.test(ln)){ pendRank = parseInt(ln,10); pend = []; continue; }
    const m = ln.match(recRe);
    if(m){
      if(pend.length){
        const nick = pend[0], real = pend[1] || '';
        const rank = pendRank != null ? pendRank : 'C';
        cur.list.push([rank, nick, real, +m[1], +m[2], +m[3], flagOf(nick)]);
      }
      pend = []; pendRank = null; continue;
    }
    if(ln.length <= 30 && !/RANKING|MEDIA|CHAMPION|인스타|instagram|http|블랙컴뱃|BLACK ?COMBAT/i.test(ln)){
      pend.push(ln);
      if(pend.length > 2) pend = pend.slice(-2);
    }
  }
  // 정리: 체급별 정렬(챔피언 먼저) + 챔피언 없으면 공석 표기
  out.forEach(d=>{
    d.list.sort((a,b)=>{
      const ra = a[0]==='C' ? 0 : a[0], rb = b[0]==='C' ? 0 : b[0];
      return ra - rb;
    });
    if(d.list.length && d.list[0][0] !== 'C') d.list.unshift(['C','공석','',0,0,0,'']);
  });
  return out.filter(d=>d.list.filter(f=>f[1]!=='공석').length >= 2);
}

let seasonCache = null;
async function openFighterStats(nick){
  if(!seasonCache){
    try{ seasonCache = await fetchSeasonData(); }catch(e){ return toastMsg('⚠️ 데이터를 불러오지 못했습니다.'); }
  }
  const d = seasonCache, rows = [];
  let totVotes = 0, corrVotes = 0;
  d.finals.forEach(t=>{
    (d.matchesBy[t.id]||[]).forEach(m=>{
      const side = m.fighter_a.trim()===nick ? 'A' : (m.fighter_b.trim()===nick ? 'B' : null);
      if(!side || !(m.winner==='A'||m.winner==='B')) return;
      const parts = d.partsBy[t.id]||[];
      const s = pickStats(m, parts);
      const corr = m.winner==='A' ? s.a : s.b;
      totVotes += s.tot; corrVotes += corr;
      rows.push({ tid:t.id, title:t.title, opp: side==='A'?m.fighter_b:m.fighter_a,

  });
  if(!rows.length) return toastMsg(`'${nick}' 선수의 승부예측 기록이 아직 없습니다.`);
  const rate = totVotes ? Math.round(corrVotes/totVotes*100) : 0;

        <div class="tile"><div class="v">${rate}%</div><div class="k">우리 방 적중률</div></div>
      </div>
      ${rows.map(r=>`<div class="pcard" style="padding:11px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-weight:800;font-size:14px">vs ${esc(r.opp)} ${r.won?'<span class="badge" style="background:#e0f3e6;color:#116131;font-size:11px">승</span>':'<span class="badge" style="background:#fdecec;color:#a51c1c;font-size:11px">패</span>'}</span>
          <span style="color:var(--muted);font-size:13px;font-weight:700">우리 방 픽 ${r.pct}%</span>
        </div>
        <div style="font-size:12px;margin-top:2px"><a href="#/t/${r.tid}" onclick="this.closest('.modal-ov').remove()" style="color:var(--dim);font-weight:700">${esc(r.title)}</a></div>
      </div>`).join('')}
    </div></div>`;
  ov.onclick = e => { if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
}

  const inputs = el.querySelectorAll('input,select,textarea');

    inputs.forEach(i=>i.addEventListener('input', clear, {once:true}));

function pick(btn){
  const mid = btn.dataset.mid, side = btn.dataset.side;
  if(voteSel[mid] === side){
    // 같은 버튼 재클릭 → 선택 해제
    delete voteSel[mid];
    btn.classList.remove('sel');
  } else {
    voteSel[mid] = side;
    document.querySelectorAll(`.corner[data-mid="${mid}"]`).forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
  }
  const c = document.getElementById('vb-count');
  if(c) c.textContent = Object.keys(voteSel).length;
}
function prefillPicks(tid){
  // 기존 참가자면 투표 내용 미리 채워주기 (수정 편의)
  const nick = document.getElementById('v-nick').value.trim().toLowerCase();
  if(!nick) return;
  sb.from('participants').select('nickname,picks').eq('tournament_id',tid).then(({data})=>{
    const me = (data||[]).find(p=>p.nickname.trim().toLowerCase()===nick);
    if(me){
      voteSel = {};
      curMatches.forEach(m=>{ if(me.picks[m.id]) voteSel[m.id] = me.picks[m.id]; });
      document.querySelectorAll('.corner[data-mid]').forEach(b=>{
        b.classList.toggle('sel', voteSel[b.dataset.mid]===b.dataset.side);
      });
      toastMsg(`'${me.nickname}'님의 기존 투표를 불러왔어요. 수정 후 비밀번호와 함께 제출하세요.`);
    }
  });
}
async function submitVote(tid, matchCount){
  const nick = document.getElementById('v-nick').value.trim();
  const pin  = document.getElementById('v-pin').value.trim();
  const msg  = document.getElementById('v-msg');
  const show = (cls, s)=>{ msg.className='msg '+cls; msg.textContent=s; msg.scrollIntoView({block:'center',behavior:'smooth'}); };
  if(!nick) return show('err','닉네임을 입력해 주세요.');
  if(!/^[0-9]{4}$/.test(pin)) return show('err','비밀번호는 숫자 4자리로 입력해 주세요.');
  if(Object.keys(voteSel).length < matchCount) return show('err', `모든 경기에 투표해야 제출할 수 있습니다. 현재 ${matchCount}경기 중 ${Object.keys(voteSel).length}경기만 선택하셨어요.`);
  const btn = document.getElementById('vb-submit'); btn.disabled=true;
  try{
    const {data, error} = await sb.rpc('submit_picks',{p_tournament:tid,p_nickname:nick,p_pin:pin,p_picks:voteSel});
    if (error) return show('err', cleanErr(error.message));
    if (data && data.ok===false) return show('err', data.error);
    show('ok', data.is_new ? `✅ ${data.nickname}님의 투표가 등록되었습니다!` : `✅ ${data.nickname}님의 투표가 수정되었습니다!`);
    setTimeout(()=>viewTournament(tid), 900);
  } finally { btn.disabled=false; }
}
function cleanErr(s){ return String(s||'오류가 발생했습니다.').replace(/^.*?:\s*/,'').trim() || '오류가 발생했습니다.'; }

/* --- 경기별 현황 + 참가자 표 --- */
function liveBoardHTML(t, matches, parts, st){
  const hasResult = st==='final' || matches.some(m=>m.winner);
  // 이변 계산: 적중률이 가장 낮은 경기
  const rateOf = m => {
    if(!(m.winner==='A'||m.winner==='B')) return null;
    const s = pickStats(m, parts);
    return s.tot ? (m.winner==='A'? s.a : s.b) / s.tot : null;
  };
  let upsetId = null, minRate = 1.01;
  if(parts.length) matches.forEach(m=>{ const r = rateOf(m); if(r!==null && r < minRate){ minRate = r; upsetId = m.id; } });
  const bars = st==='open' ? '' : matches.map(m=>{
    const winA = m.winner==='A', winB = m.winner==='B';
    const r = rateOf(m);
    let tag = '';
    if(r!==null){
      if(m.id===upsetId && r<0.5) tag = `<span class="badge" style="background:#fdecec;color:#a51c1c;font-size:11px">😱 최대 이변 · ${Math.round(r*100)}%만 적중</span>`;
      else if(r===1) tag = '<span class="badge" style="background:#e0f3e6;color:#116131;font-size:11px">🎯 전원 적중</span>';
      else if(r===0) tag = '<span class="badge" style="background:#e6eaf0;color:#525d6b;font-size:11px">💀 전원 실패</span>';
    }
    let hitters = '';
    if(m.id===upsetId && r!==null && r>0 && r<0.35){
      const names = parts.filter(p=>p.picks[m.id]===m.winner).map(p=>p.nickname);
      if(names.length<=10) hitters = `<div class="note" style="margin-top:6px;font-size:12.5px">이변 적중 ${names.length}명: <b>${names.map(esc).join(', ')}</b></div>`;
    }
    return `<div class="match">
      <div class="no"><span>${m.seq}경기 ${m.winner==='X'?'<span class="badge done">무효/무승부</span>':''} ${tag}</span>
        ${hasResult&&(winA||winB)?`<span class="wintag">🏆 ${esc(winA?m.fighter_a:m.fighter_b)} 승</span>`:''}</div>
      <div class="split" onclick="openMatchVoters('${m.id}')" style="cursor:pointer" title="누가 투표했는지 보기">${splitInner(m, parts, hasResult)}</div>${hitters}</div>`;
  }).join('');

  return `
    ${st!=='open' && parts.length ? `<div class="sec-title" style="justify-content:space-between">경기 결과
      ${st==='wait'?'<button class="btn-parts" onclick="openPartsModal()">참가자 예측 현황</button>':''}</div>
      <div class="note" style="margin-top:4px">게이지를 누르면 <b>투표자 목록</b>이 보입니다.</div>
      <div class="vote-grid">${bars}</div>` : ''}
    <div style="display:none"><div class="pf-scope" id="pf-area">${partsAreaHTML(matches, parts, st)}</div></div>`;
}

/* ---------- 시즌 랭킹 / 개인 페이지 ---------- */
async function fetchSeasonData(){
  const [t, m, p] = await Promise.all([
    sb.from('tournaments').select('*').eq('finalized',true),
    sb.from('matches').select('*'),
    sb.from('participants').select('id,tournament_id,nickname,picks,created_at,updated_at')
  ]);
  if(t.error) throw t.error;
  const finals = t.data||[];
  const fids = new Set(finals.map(x=>x.id));
  const matchesBy={}, partsBy={};
  (m.data||[]).forEach(x=>{ (matchesBy[x.tournament_id]=matchesBy[x.tournament_id]||[]).push(x); });
  Object.values(matchesBy).forEach(a=>a.sort((x,y)=>x.seq-y.seq));
  (p.data||[]).forEach(x=>{ if(fids.has(x.tournament_id)) (partsBy[x.tournament_id]=partsBy[x.tournament_id]||[]).push(x); });
  return {finals: finals.sort((a,b)=>new Date(b.deadline)-new Date(a.deadline)), matchesBy, partsBy};
}
const WIN_TITLES  = [[5,'👑 예측의 신'],[4,'🤖 적중 머신'],[3,'😎 격잘알'],[2,'🔥 예측 좀 치네']];
const LOSE_TITLES = [[4,'☠️ 반대로만 찍어'],[3,'👎 역배 장인'],[2,'🥵 감다뒤'],[1,'💩 꼴등']];
// 대회 시간순으로 연속 우승/연속 꼴등 최고 기록 계산 (대회를 건너뛰면 연속 끊김)
function computeStreaks(d){
  const asc = d.finals.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const cur = {}, best = {};
  asc.forEach(t=>{
    const parts = d.partsBy[t.id]||[];
    if(!parts.length) return;
    const ranked = rankParts(parts, d.matchesBy[t.id]||[]);
    const maxRank = Math.max(...ranked.map(r=>r.rank));
    const winners = new Set(ranked.filter(r=>r.rank===1).map(r=>r.nickname.trim().toLowerCase()));
    const losers  = new Set(maxRank>1 ? ranked.filter(r=>r.rank===maxRank).map(r=>r.nickname.trim().toLowerCase()) : []);
    const nicks   = ranked.map(r=>r.nickname.trim().toLowerCase());
    nicks.forEach(n=>{
      const c = cur[n] = cur[n]||{w:0,l:0};
      c.w = winners.has(n) ? c.w+1 : 0;
      c.l = losers.has(n)  ? c.l+1 : 0;
      const b = best[n] = best[n]||{w:0,l:0};
      b.w = Math.max(b.w, c.w); b.l = Math.max(b.l, c.l);
    });
    Object.keys(cur).forEach(n=>{ if(!nicks.includes(n)){ cur[n].w=0; cur[n].l=0; } });
  });
  return best;
}
function badgesFor(a, streaks){
  const s = streaks[a.nickname.trim().toLowerCase()] || {w:0,l:0};
  const b = [];
  const w = WIN_TITLES.find(x=>s.w>=x[0]);
  if(w) b.push([w[1], `연속 ${s.w}회 우승`, 'w']);
  const l = LOSE_TITLES.find(x=>s.l>=x[0]);
  if(l) b.push([l[1], s.l>1?`연속 ${s.l}회 꼴등`:'꼴등 1회', 'l']);
  return b;
}
function badgeChip(b, big){
  return `<span class="ubadge${b[2]==='l'?' lose':''}" ${big?'style="font-size:12.5px;padding:4px 10px"':''} title="${b[1]}" onclick="event.preventDefault();event.stopPropagation();toastMsg('${b[0]} — ${b[1]}')">${b[0]}</span>`;
}
function buildSeason(d){
  // 닉네임(소문자 기준)별 통합 전적
  const agg = {};
  d.finals.forEach(t=>{
    const matches = d.matchesBy[t.id]||[];
    const parts = d.partsBy[t.id]||[];
    if(!parts.length) return;
    const ranked = rankParts(parts, matches);
    ranked.forEach(r=>{
      const k = r.nickname.trim().toLowerCase();
      const a = agg[k] = agg[k]||{nickname:r.nickname, plays:0, wins:0, hit:0, total:0, records:[]};
      a.plays++; a.hit+=r.hit; a.total+=r.total;
      if(r.rank===1) a.wins++;
      a.records.push({t, rank:r.rank, hit:r.hit, total:r.total, entrants:parts.length});
    });
  });
  return Object.values(agg);
}

  if(!confirm('선물 당첨자를 랜덤 추첨할까요?\n추첨 결과는 저장되어 바뀌지 않습니다.')) return;

  if(!d.t.finalized) return toastMsg('⚠️ 먼저 경기 결과를 모두 입력해 주세요.');
  const ranked = rankParts(d.parts, d.matches);
  const first  = ranked.filter(r=>r.rank===1).map(r=>r.nickname);
  const second = ranked.filter(r=>r.rank===2).map(r=>r.nickname);
  const {error} = await sb.rpc('admin_draw_gifts',{p_pass:adminPass(), p_tid:tid, p_first:first, p_second:second});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('🎲 추첨이 완료되었습니다!');
  viewTournament(tid);
}
async function cancelGifts(tid){
  if(!adminPass()) return toastMsg('⚠️ 추첨 취소는 관리자만 실행할 수 있습니다.');
  if(!confirm('선물 추첨을 취소할까요?\n당첨자 표시가 사라지고, [선물 추첨하기]로 다시 추첨할 수 있습니다.')) return;
  const {error} = await sb.rpc('admin_clear_gifts',{p_pass:adminPass(), p_tid:tid});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('추첨이 취소되었습니다.');
  viewTournament(tid);
}
async function openGift(tid){
  const box = document.getElementById('gift-'+tid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const {data:t, error} = await sb.from('tournaments').select('*').eq('id',tid).single();
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  box.innerHTML = `
    <hr class="sep">
    <div style="font-size:13px;font-weight:700;color:var(--muted)">등수별 선물 지급 최대 인원 · 공동 인원이 초과되면 그 안에서 랜덤 추첨됩니다</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:14px;font-weight:700">
      1등 <input id="g1d-${tid}" value="${esc(t.gift1_desc||'')}" placeholder="선물 내용" style="width:150px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:7px 9px">
      최대 <input type="number" id="g1-${tid}" value="${t.gift1_max??2}" min="0" max="99" style="width:60px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:7px 8px;text-align:center">명
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:14px;font-weight:700">
      2등 <input id="g2d-${tid}" value="${esc(t.gift2_desc||'')}" placeholder="선물 내용" style="width:150px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:7px 9px">
      최대 <input type="number" id="g2-${tid}" value="${t.gift2_max??5}" min="0" max="99" style="width:60px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:7px 8px;text-align:center">명
      <button class="btn small" onclick="saveGiftRules('${tid}')">저장</button>
    </div>
    <div id="gift-res-${tid}" class="note">${t.gift_winners ? renderGiftWinners(t.gift_winners) : '추첨은 결과 확정 후, 대회 결과 페이지의 [선물 추첨하기] 버튼(관리자 로그인 시에만 표시)으로 진행합니다.'}</div>`;
}
function renderGiftWinners(gw){
  return `🎁 <b>현재 당첨자</b> — 1등: ${(gw.first||[]).map(esc).join(', ')||'-'} / 2등: ${(gw.second||[]).map(esc).join(', ')||'-'}
  <br>결과 페이지의 당첨 안내에 자동으로 표시됩니다.`;
}
async function saveGiftRules(tid, silent){
  const g1 = parseInt(document.getElementById('g1-'+tid).value||'0',10);
  const g2 = parseInt(document.getElementById('g2-'+tid).value||'0',10);
  const {error} = await sb.rpc('admin_set_gift_rules',{p_pass:adminPass(), p_tid:tid, p_g1:g1, p_g2:g2,
    p_g1desc:document.getElementById('g1d-'+tid).value.trim()||null,
    p_g2desc:document.getElementById('g2d-'+tid).value.trim()||null});
  if(error){ toastMsg('⚠️ '+cleanErr(error.message)); return false; }
  if(!silent){ toastMsg('저장되었습니다.'); flashEl(document.getElementById('gift-'+tid)); }
  return true;
}
async function openMatchEdit(tid){
  const box = document.getElementById('mx-'+tid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const {data:ms} = await sb.from('matches').select('*').eq('tournament_id',tid).order('seq');
  box.innerHTML = `<hr class="sep">
    <div style="font-size:13px;font-weight:700;color:var(--muted)">선수 이름을 수정한 뒤 맨 아래 [전체 저장]을 누르세요 · ✕는 경기 삭제 · 맨 아래에서 경기 추가 (투표 데이터는 유지됩니다)</div>
    ${(ms||[]).map(m=>`<div class="mrow" data-mid="${m.id}" style="grid-template-columns:24px 1fr 1fr 30px">
      <span style="color:var(--dim);font-size:12px;font-weight:700">${m.seq}</span>
      <input id="ma-${m.id}" value="${esc(m.fighter_a)}" data-orig="${esc(m.fighter_a)}" list="fighters-dl">
      <input id="mb-${m.id}" value="${esc(m.fighter_b)}" data-orig="${esc(m.fighter_b)}" list="fighters-dl">
      <button class="del-x" onclick="delMatch('${m.id}','${tid}')">✕</button>
    </div>`).join('')}
    <div class="mrow" style="grid-template-columns:24px 1fr 1fr 82px;margin-top:12px">
      <span style="color:var(--dim);font-size:14px;font-weight:800">+</span>
      <input id="na-${tid}" placeholder="선수 1" list="fighters-dl">
      <input id="nb-${tid}" placeholder="선수 2" list="fighters-dl">
      <button class="btn xs" onclick="addMatch('${tid}')">경기 추가</button>
    </div>
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="saveAllMatches('${tid}')">수정한 대진 전체 저장</button>`;
}
async function saveAllMatches(tid){
  const box = document.getElementById('mx-'+tid);
  const rows = [...box.querySelectorAll('.mrow[data-mid]')];
  const changed = rows.filter(r=>{
    const [a,b] = r.querySelectorAll('input');
    return a.value.trim() !== a.dataset.orig || b.value.trim() !== b.dataset.orig;
  });
  if(!changed.length) return toastMsg('변경된 내용이 없습니다.');
  let ok = 0;
  for(const r of changed){
    const [a,b] = r.querySelectorAll('input');
    if(!a.value.trim() || !b.value.trim()){ toastMsg('⚠️ 선수 이름이 비어 있는 경기가 있습니다.'); return; }
    const {error} = await sb.rpc('admin_update_match',{p_pass:adminPass(), p_mid:r.dataset.mid, p_a:a.value.trim(), p_b:b.value.trim()});
    if(error) return matchErr(error);
    a.dataset.orig = a.value.trim(); b.dataset.orig = b.value.trim();
    flashEl(r); ok++;
  }
  toastMsg(`✅ ${ok}개 경기가 저장되었습니다.`);
}
function matchEditRefresh(tid){
  const box = document.getElementById('mx-'+tid);
  box.innerHTML=''; openMatchEdit(tid);
}
function matchErr(error){
  const m = cleanErr(error.message);
  if(/function|찾을 수 없|not find/i.test(error.message||''))
    return toastMsg('⚠️ 대진관리_패치.sql을 Supabase에서 먼저 실행해 주세요.');
  toastMsg('⚠️ '+m);
}
async function addMatch(tid){
  const a = document.getElementById('na-'+tid).value.trim();
  const b = document.getElementById('nb-'+tid).value.trim();
  if(!a || !b) return toastMsg('⚠️ 선수 이름을 입력해 주세요.');
  const {error} = await sb.rpc('admin_add_match',{p_pass:adminPass(), p_tid:tid, p_a:a, p_b:b});
  if(error) return matchErr(error);
  toastMsg('경기가 추가되었습니다.');
  matchEditRefresh(tid);
}
async function delMatch(mid, tid){
  if(!confirm('이 경기를 삭제할까요? 해당 경기에 대한 투표 선택도 채점에서 제외됩니다.')) return;
  const {error} = await sb.rpc('admin_delete_match',{p_pass:adminPass(), p_mid:mid});
  if(error) return matchErr(error);
  toastMsg('경기가 삭제되었습니다. 번호가 자동 정렬됩니다.');
  matchEditRefresh(tid);
}
async function openMembers(tid){
  const box = document.getElementById('mem-'+tid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const {data} = await sb.from('participants').select('id,nickname,created_at').eq('tournament_id',tid).order('created_at');
  box.innerHTML = `
    <hr class="sep">
    <div style="font-size:13px;font-weight:700;color:var(--muted)">참가자 ${(data||[]).length}명 · 삭제하면 해당 닉네임의 투표가 완전히 제거됩니다 (부적절 닉네임/도배 정리용)</div>
    ${(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #eef1f6;flex-wrap:wrap" id="mrow-${p.id}">
      <b id="mn-${p.id}">${esc(p.nickname)}</b>
      <span style="display:inline-flex;gap:5px">
        <button class="btn xs" onclick="editMemberName('${p.id}')">이름 변경</button>
        <button class="btn xs" onclick="resetPin('${p.id}')">비번 초기화</button>
        <button class="btn xs" style="color:#c62828" onclick="delMember('${tid}','${p.id}')">강제 삭제</button>
      </span>
    </div>`).join('') || '<div class="empty" style="padding:14px 0">참가자가 없습니다.</div>'}`;
}
function editMemberName(pid){
  const el = document.getElementById('mn-'+pid);
  if(!el || el.dataset.e) return;
  el.dataset.e = '1';
  const cur = el.textContent.trim();
  el.dataset.orig = cur;
  el.innerHTML = `<input id="mni-${pid}" value="${esc(cur)}" maxlength="20"
      style="background:#fff;border:1.5px solid var(--key);border-radius:8px;padding:5px 8px;font-size:13.5px;font-weight:700;width:130px"
      onkeydown="if(event.key==='Enter')saveMemberName('${pid}'); if(event.key==='Escape')cancelMemberName('${pid}')">
    <button class="btn xs primary" onclick="saveMemberName('${pid}')">저장</button>
    <button class="btn xs" onclick="cancelMemberName('${pid}')">취소</button>`;
}
function cancelMemberName(pid){
  const el = document.getElementById('mn-'+pid);
  if(!el) return;
  el.textContent = el.dataset.orig||'';
  delete el.dataset.e;
}
async function saveMemberName(pid){
  const v = document.getElementById('mni-'+pid).value.trim();
  if(!v) return toastMsg('⚠️ 닉네임을 입력해 주세요.');
  const {error} = await sb.rpc('admin_rename_participant',{p_pass:adminPass(), p_pid:pid, p_new:v});
  if(error){
    if(/function|not find/i.test(error.message||'')) return toastMsg('⚠️ 참가자관리_패치.sql을 먼저 실행해 주세요.');
    return toastMsg('⚠️ '+cleanErr(error.message));
  }
  const el = document.getElementById('mn-'+pid);
  delete el.dataset.e;
  el.textContent = v;
  toastMsg('닉네임이 변경되었습니다.');
  flashEl(document.getElementById('mrow-'+pid));
}
async function resetPin(pid){
  if(!confirm('이 참가자의 비밀번호를 0000으로 초기화할까요?\n(유저에게 0000으로 로그인 후 수정하라고 안내하세요)')) return;
  const {error} = await sb.rpc('admin_reset_pin',{p_pass:adminPass(), p_pid:pid});
  if(error){
    if(/function|not find/i.test(error.message||'')) return toastMsg('⚠️ 참가자관리_패치.sql을 먼저 실행해 주세요.');
    return toastMsg('⚠️ '+cleanErr(error.message));
  }
  toastMsg('비밀번호가 0000으로 초기화되었습니다.');
  flashEl(document.getElementById('mrow-'+pid));
}
async function delMember(tid, pid){
  if(!confirm('이 참가자의 투표를 완전히 삭제할까요? 되돌릴 수 없습니다.')) return;
  const {error} = await sb.rpc('admin_delete_participant',{p_pass:adminPass(), p_pid:pid});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('참가자가 삭제되었습니다.');
  const box = document.getElementById('mem-'+tid);
  box.innerHTML=''; openMembers(tid);
}
async function openResults(tid){
  const box = document.getElementById('res-'+tid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const {data:matches} = await sb.from('matches').select('*').eq('tournament_id',tid).order('seq');
  resSel[tid] = {};
  (matches||[]).forEach(m=>{ if(m.winner) resSel[tid][m.id]=m.winner; });
  box.innerHTML = `
    <hr class="sep">
    <div style="font-size:13px;font-weight:700;color:var(--muted)">실제 승자를 선택하세요 (무 = 무승부/무효, 채점 제외)</div>
    ${(matches||[]).map(m=>`
      <div class="res-row" data-mid="${m.id}">
        <button class="res-btn ${resSel[tid][m.id]==='A'?'selA':''}" onclick="setRes('${tid}','${m.id}','A',this)">${esc(m.fighter_a)}</button>
        <button class="res-btn ${resSel[tid][m.id]==='B'?'selB':''}" onclick="setRes('${tid}','${m.id}','B',this)">${esc(m.fighter_b)}</button>
        <button class="res-btn ${resSel[tid][m.id]==='X'?'selX':''}" onclick="setRes('${tid}','${m.id}','X',this)">무</button>
      </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn primary" onclick="saveResults('${tid}')">💾 결과 저장</button>
      <button class="btn small ghost" style="color:var(--dim)" onclick="clearResults('${tid}')">결과 전체 초기화</button>
    </div>`;
}
function setRes(tid, mid, v, btn){
  const row = btn.parentElement;
  row.querySelectorAll('.res-btn').forEach(b=>b.classList.remove('selA','selB','selX'));
  if(resSel[tid][mid] === v){
    delete resSel[tid][mid]; // 재클릭 → 선택 해제
  } else {
    resSel[tid][mid] = v;
    btn.classList.add('sel'+v);
  }
}
async function saveResults(tid){
  const {error} = await sb.rpc('admin_set_results',{p_pass:adminPass(), p_tid:tid, p_winners:resSel[tid]||{}});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('결과가 저장되었습니다. 순위가 자동 계산됩니다!');
  route();
}
async function clearResults(tid){
  if(!confirm('이 대회의 모든 경기 결과를 지울까요? (투표는 유지됩니다)')) return;
  const {error} = await sb.rpc('admin_clear_results',{p_pass:adminPass(), p_tid:tid});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  route();
}
async function cloneTournament(tid){
  const d = await fetchTournament(tid);
  const box = document.getElementById('create-box');
  if(box.style.display==='none') toggleCreate(document.getElementById('create-toggle'));
  document.getElementById('c-title').value = d.t.title;
  document.getElementById('c-g1').value = d.t.gift1_desc||'';
  document.getElementById('c-g1n').value = d.t.gift1_max??2;
  document.getElementById('c-g2').value = d.t.gift2_desc||'';
  document.getElementById('c-g2n').value = d.t.gift2_max??5;
  const cm = document.getElementById('c-matches'); cm.innerHTML = '';
  d.matches.forEach(m=>addMatchRow(m.fighter_a, m.fighter_b));
  window.scrollTo({top:0, behavior:'smooth'});
  toastMsg('대진·선물이 복사되었습니다. 날짜와 마감 시각만 설정하세요!');
}
function editTitle(tid){
  const el = document.getElementById('tt-'+tid);
  if(!el || el.dataset.editing) return;
  el.dataset.editing = '1';
  const cur = el.textContent.replace(' ✏️','').trim();
  el.dataset.orig = cur;
  el.innerHTML = `<input id="tin-${tid}" value="${esc(cur)}" maxlength="60"
      style="background:#fff;border:1.5px solid var(--key);border-radius:8px;padding:6px 9px;font-size:14px;font-weight:700;width:200px"
      onclick="event.stopPropagation()"
      onkeydown="if(event.key==='Enter')saveTitle('${tid}'); if(event.key==='Escape')cancelTitle('${tid}')">
    <button class="btn xs primary" onclick="event.stopPropagation();saveTitle('${tid}')">저장</button>
    <button class="btn xs" onclick="event.stopPropagation();cancelTitle('${tid}')">취소</button>`;
}
function cancelTitle(tid){
  const el = document.getElementById('tt-'+tid);
  if(!el) return;
  el.innerHTML = esc(el.dataset.orig||'') + ' ✏️';
  delete el.dataset.editing;
}
async function saveTitle(tid){
  const v = document.getElementById('tin-'+tid).value.trim();
  if(!v) return toastMsg('⚠️ 대회명을 입력해 주세요.');
  const {error} = await sb.rpc('admin_update_tournament',{
    p_pass:adminPass(), p_tid:tid, p_title:v, p_event_date:null, p_deadline:null});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('대회명이 수정되었습니다.');
  route();
  setTimeout(()=>flashEl(document.getElementById('tt-'+tid)), 900);
}
async function editDeadline(tid){
  const box = document.getElementById('dl-'+tid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const {data:t, error} = await sb.from('tournaments').select('*').eq('id',tid).single();
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  const d = new Date(t.deadline), pad = n=>String(n).padStart(2,'0');
  const dlVal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  box.innerHTML = `<hr class="sep">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:700;color:var(--muted)">경기 시작일</span>
      <input type="datetime-local" id="evi-${tid}" value="${t.event_date? t.event_date+'T00:00' : ''}" style="background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--text)">
      <span style="font-size:13px;font-weight:700;color:var(--muted)">투표 마감</span>
      <input type="datetime-local" id="dli-${tid}" value="${dlVal}" style="background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--text)">
      <button class="btn primary small" onclick="saveDeadline('${tid}')">저장</button>
    </div>`;
}
async function saveDeadline(tid){
  const v = document.getElementById('dli-'+tid).value;
  const ev = document.getElementById('evi-'+tid).value;
  if(!v) return toastMsg('⚠️ 마감 시각을 선택해 주세요.');
  const {error} = await sb.rpc('admin_update_tournament',{
    p_pass:adminPass(), p_tid:tid, p_title:null, p_event_date: ev? ev.slice(0,10) : null, p_deadline:new Date(v).toISOString()});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('일정이 변경되었습니다.');
  route();
  setTimeout(()=>flashEl(document.getElementById('dls-'+tid)), 900);
}
async function delTournament(tid, title){
  if(!confirm(`'${title}' 대회를 삭제할까요?\n투표 기록도 함께 삭제되며 되돌릴 수 없습니다.`)) return;
  const {error} = await sb.rpc('admin_delete_tournament',{p_pass:adminPass(), p_tid:tid});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  toastMsg('삭제되었습니다.');
  route();
}
async function changePass(){
  const nw = document.getElementById('p-new').value;
  if(nw.length<4) return toastMsg('⚠️ 새 비밀번호는 4자 이상이어야 합니다.');
  const {error} = await sb.rpc('admin_change_password',{p_old:adminPass(), p_new:nw});
  if(error) return toastMsg('⚠️ '+cleanErr(error.message));
  sessionStorage.setItem('fp_admin', nw);
  toastMsg('관리자 비밀번호가 변경되었습니다.');
}

boot();
</script>
</body>
</html>
