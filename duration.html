<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>영상 길이 입력 · 블붕이</title>
<style>
  :root { --bg:#f6f6f7; --card:#fff; --text:#111; --sub:#666; --line:#e2e2e5; --accent:#c8a24a; --ok:#1a7f37; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1b1c1f; --text:#f2f2f3; --sub:#9a9aa1; --line:#2c2d31; --ok:#4cc26a; --err:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding: calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 28px); max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
  input[type=password], input[type=text] { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  .row { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:14px; color:var(--sub); }
  .video { display:flex; gap:10px; padding:10px; border:2px solid transparent; border-radius:12px; cursor:pointer; background:var(--bg); margin-bottom:8px; }
  .video.sel { border-color:var(--accent); }
  .video img { width:96px; height:54px; object-fit:cover; border-radius:8px; flex:none; background:#000; }
  .video .t { font-size:14px; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .video .m { font-size:12px; color:var(--sub); margin-top:3px; }
  .badge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; margin-left:4px; }
  .badge.none { background:#fde8e8; color:#b3261e; } .badge.has { background:#e3f4e8; color:#1a7f37; }
  button { width:100%; padding:14px; font-size:16px; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#111; margin-top:10px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:600; padding:10px; }
  button:disabled { opacity:.5; }
  #msg { margin-top:10px; font-size:14px; white-space:pre-wrap; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .hint { font-size:12px; color:var(--sub); margin-top:6px; }
</style>
</head>
<body>
<h1>⏱ 영상 길이 입력</h1>
<div class="sub">프리미어 중 영상 길이를 직접 입력합니다. 프리미어가 끝나면 자동 동기화가 실제 길이로 다시 덮어씁니다.</div>

<div class="card">
  <label for="pw">관리자 비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="어드민 비밀번호">
  <div class="row"><input id="remember" type="checkbox"><label for="remember" style="margin:0">이 기기에 기억하기</label></div>
</div>

<div class="card">
  <label>영상 선택 (최근 영상)</label>
  <div id="list">불러오는 중…</div>
  <button class="ghost" id="reload" type="button">목록 새로고침</button>
  <label for="manual" style="margin-top:12px">목록에 없으면 영상 주소 또는 ID 직접 입력</label>
  <input id="manual" type="text" placeholder="https://youtu.be/… 또는 영상 ID 11글자" autocapitalize="off" autocorrect="off">
</div>

<div class="card">
  <label for="dur">영상 길이</label>
  <input id="dur" type="text" inputmode="numeric" placeholder="예) 12:34  또는  1:02:03  또는  754 (초)">
  <div class="hint">플레이어에 표시되는 전체 시간을 그대로 입력하세요. 분:초 형식이 편합니다.</div>
  <button id="send" type="button">사이트에 반영</button>
  <div id="msg"></div>
</div>

<script>
(function () {
  var SB = 'https://dbtzakbmyfmqudjiycoj.supabase.co';
  var KEY = 'sb_publishable_xtTqzRYwBZBUQyeqHhHVcA_CG2e-1fA';
  var selected = '';
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function fmt(sec) {
    var n = Number(sec); if (!(n > 0)) return '';
    var h = Math.floor(n / 3600), m = Math.floor((n - h * 3600) / 60), s = n - h * 3600 - m * 60;
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
  }
  function parseDur(t) {
    t = String(t || '').trim();
    if (!t) return 0;
    if (/^\d+$/.test(t)) return parseInt(t, 10);                 // 초 단위
    var parts = t.split(':');
    if (parts.length < 2 || parts.length > 3 || parts.some(function (x) { return !/^\d+$/.test(x); })) return 0;
    var n = parts.map(function (x) { return parseInt(x, 10); });
    return n.length === 2 ? n[0] * 60 + n[1] : n[0] * 3600 + n[1] * 60 + n[2];
  }
  function extractId(t) {
    t = String(t || '').trim();
    var m = /(?:v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/.exec(t);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{11}$/.test(t) ? t : '';
  }
  function say(text, ok) { var m = $('msg'); m.className = ok ? 'ok' : 'err'; m.textContent = text; }

  function rpc(name, body) {
    return fetch(SB + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j }; }); });
  }

  function render(rows) {
    var box = $('list');
    if (!rows.length) { box.textContent = '영상이 없습니다.'; return; }
    box.innerHTML = '';
    rows.forEach(function (v) {
      var d = document.createElement('div');
      d.className = 'video' + (v.video_id === selected ? ' sel' : '');
      var when = new Date(v.published_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      d.innerHTML = '<img alt="" src="' + esc(v.thumbnail_url) + '"><div><div class="t">' + esc(v.title) + '</div>' +
        '<div class="m">' + esc(when) + (v.duration_sec > 0 ? '<span class="badge has">⏱ ' + esc(fmt(v.duration_sec)) + '</span>' : '<span class="badge none">길이 없음</span>') + '</div></div>';
      d.addEventListener('click', function () {
        selected = v.video_id; $('manual').value = '';
        Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('sel'); });
        d.classList.add('sel');
      });
      box.appendChild(d);
    });
  }

  function load() {
    $('list').textContent = '불러오는 중…';
    rpc('yt_get_recent', { p_limit: 12, p_exclude_shorts: false, p_before: null }).then(function (r) {
      if (Array.isArray(r.json)) render(r.json); else $('list').textContent = '목록을 불러오지 못했습니다: ' + JSON.stringify(r.json);
    }).catch(function (e) { $('list').textContent = '목록 오류: ' + e.message; });
  }

  $('reload').addEventListener('click', load);
  $('manual').addEventListener('input', function () { if (this.value.trim()) { selected = ''; Array.prototype.forEach.call($('list').children, function (c) { c.classList.remove('sel'); }); } });

  try { var saved = localStorage.getItem('dur_pw'); if (saved) { $('pw').value = saved; $('remember').checked = true; } } catch (e) {}

  $('send').addEventListener('click', function () {
    var id = extractId($('manual').value) || selected;
    var sec = parseDur($('dur').value);
    var pw = $('pw').value;
    if (!pw) return say('비밀번호를 입력해 주세요.', false);
    if (!id) return say('영상을 선택하거나 주소/ID를 입력해 주세요.', false);
    if (!(sec > 0)) return say('길이를 12:34 형식으로 입력해 주세요.', false);
    if (!confirm('길이 ' + fmt(sec) + ' 로 반영할까요?')) return;
    $('send').disabled = true; say('전송 중…', true);
    rpc('yt_admin_set_duration', { p_pass: pw, p_video_id: id, p_duration_sec: sec }).then(function (r) {
      var j = r.json;
      if (j && j.ok) {
        try { if ($('remember').checked) localStorage.setItem('dur_pw', pw); else localStorage.removeItem('dur_pw'); } catch (e) {}
        say(j.applied_now ? '✅ 반영 완료: ' + fmt(sec) : '✅ 저장 완료: ' + fmt(sec) + '\n(영상이 사이트에 등록되면 자동 반영됩니다)', true);
        $('dur').value = ''; load();
      } else if (j && j.code === 'AUTH') say('❌ 비밀번호가 맞지 않습니다.', false);
      else say('❌ 실패: ' + JSON.stringify(j) + ' (HTTP ' + r.status + ')', false);
    }).catch(function (e) { say('❌ 오류: ' + e.message, false); })
      .then(function () { $('send').disabled = false; });
  });

  load();
})();
</script>
</body>
</html>
